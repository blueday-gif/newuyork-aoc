concepts = ["expected_observed", "report_time"]
related = [49, 50]

background = """
#### 기대값 대비 관측값
"밤에 소음이 몰린다"를 숫자로 말하는 가장 쉬운 방법은 **아무 쏠림이 없다면 얼마여야 하는지**(기대값)를 먼저 정하는 것이다.

- 하루 24시간 중 밤 10시 ~ 새벽 6시는 8시간이다. 고르게 들어온다면 **33%**여야 한다. 실제로는 **45%**다.
- 일주일 7일 중 토·일은 2일이다. 고르게 들어온다면 **29%**(2/7)여야 한다. 실제로는 **40%**다.

#### 얼마나 다른가
24시간을 한꺼번에 비교하면 카이제곱 통계량이 약 29.6만이다. '고르게 들어온다'는 가정과는 비교할 수 없을 만큼 다르다.
다만 78만 건짜리 자료에서는 아주 작은 차이도 통계적으로 '유의'하게 나온다. 그래서 '유의하다'보다
"33%여야 할 시간대에 45%가 몰린다"처럼 **차이의 크기**를 말하는 편이 더 정직하다.

#### 초보자가 처음 배우는 비교법
기대값 대비 관측값은 거의 모든 비교의 바탕이다. 인구 몫 대비 민원 몫(→ 2번), 면적 몫 대비 인구 몫(→ 32번)도 같은 생각이다.
"""

method = """
1. 소음 민원의 접수 시각(시)과 요일.
2. 기대 비율: 밤 8시간 = 8/24, 주말 = 2/7.
3. 24시간 건수로 '고르게 분포' 가정의 카이제곱 검정(자유도 23).
"""

caveats = """
- 고르게 들어온다는 기대 자체가 비현실적이다(사람은 밤에 잔다). 기대값은 '무엇과 비교하는가'를 분명히 하는 도구다.
"""
