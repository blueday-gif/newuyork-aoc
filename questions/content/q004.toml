concepts = ["duplicate", "hpd", "heat_season", "admin_closed"]
related = [5, 6, 7, 56]

background = """
#### City Limits 기사
City Limits는 한파 때 난방 민원이 사상 최고를 찍었고, 그 상당수가 "중복"으로 처리된다고 보도했다.
세입자 입장에서는 "신고했는데 중복이라며 닫혔다"는 경험이 된다.

#### 중복은 어떻게 생기나
난방은 보일러 하나가 건물 전체를 데운다. 보일러가 멈추면 수십 세대가 같은 날 신고한다.
HPD는 그중 한 건을 **건물 전체 상태**로 열어 두고, 나머지를 "이미 다른 세입자가 신고한 건물 전체 문제의 중복"으로 닫는다.
점검원은 한 집만 확인해도 건물 전체 위반을 낼 수 있다.
결과문 1위가 바로 이 문구다(108,442건).

#### 숫자로 보면
1년 전체 난방 민원의 30.8%, 한파 주간(1/24–2/1)에는 38.5%가 중복이다. "대부분"은 아니지만 많다.
주별로 보면 민원이 몰리는 주일수록 중복 비율이 오른다. 문제가 클수록 한 건물에서 더 많은 세대가 신고하기 때문이다.

#### 중복이 아닌 나머지는?
결과문을 묶어 보면 "복구됐다고 확인(전화·세입자)", "점검 못 함(문을 못 엶)"도 큰 몫이다.
실제로 **위반이 발부된 결과문은 소수**다(→ 6번).
"""

method = """
1. `Problem = "HEAT/HOT WATER"` 전체(12개월).
2. 결과문에 "duplicate"가 들어 있으면 중복.
3. 주별 비율은 난방 시즌(2025-11 ~ 2026-05) 중 주 500건 이상인 주만 그렸다.
4. 결과 분류는 규칙 순서대로 적용했다: 중복 → 복구 확인 → 점검 못 함 → 위반 발부 → 위반 없음 → 점검(결과는 HPD 사이트) → 미해결 통보 → 기타.
"""

caveats = """
- 중복은 HPD의 업무 방식이지 "가짜 신고"가 아니다. 중복 민원을 낸 세대도 실제로 추웠다.
- 결과문 문구는 기관이 바꿀 수 있다. 몇 년을 비교하려면 문구 변화를 먼저 확인한다.
"""

