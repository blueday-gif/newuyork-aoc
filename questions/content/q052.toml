concepts = ["seasonality", "outlier", "baseline"]
related = [50, 53, 54, 11]

background = """
#### 결과
1년 중 소음 민원이 가장 많은 날은 **2026년 6월 21일(일요일)**, 5,350건이다. 하루 평균 2,158건의 2.5배다.
상위 10일은 모두 토·일요일이고, 대부분 5–7월이다(7월 26일 일요일 5,201건, 5월 17일 일요일 4,826건 등). 9월 초 주말 두 날도 들어 있다.

10위인 **12월 6일(토)** 4,190건은 다르다. 그중 2,168건(52%)이 11번의 한 주소에서 왔다. 이 주소를 빼면 상위 10일에 들지 못한다.

#### 여름 주말 밤
하지 무렵은 해가 길고 따뜻해 밖에서 오래 머문다. 창문을 열어 두니 소리도 더 들린다.
토요일 밤 늦게 시작된 신고가 일요일 날짜로 잡히므로 상위 날은 일요일이 많다(→ 50번).

#### 선 그래프 읽기
겨울은 낮고 여름은 높은 큰 물결 위에 주말마다 작은 톱니가 있다.
11–12월의 이상하게 높은 구간은 11번의 한 주소(하루 수백 건) 때문이다. 계절이 아니다.
"""

method = """
1. 소음 민원을 날짜별로 셌다(접수일 기준).
2. 하루 평균 = 365일 합계 ÷ 날 수.
"""

caveats = """
- 날짜는 자정 기준이라 토요일 밤의 소음 일부가 일요일로 넘어간다.
"""
