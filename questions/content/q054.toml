concepts = ["baseline", "seasonality"]
related = [52, 53, 56]

background = """
#### 원문의 답
"새해 첫날(1/1) 소음은 2,092건으로 평일 수준이다. 한겨울에는 창문을 닫는다."

#### 무엇과 비교했나
- **1년 하루 평균**(2,158건)과 비교하면 새해 첫날은 0.97배로 평범하다.
- 하지만 1년 평균에는 여름의 높은 날이 섞여 있다. **같은 계절**, 1월 평일 하루 평균은 약 1,335건이다.
  이 기준으로 보면 새해 첫날은 **1.6배**로 꽤 많다.

그러니 "평일 수준"은 기준을 1년 평균으로 잡았을 때만 맞다. 계절성이 강한 자료는 같은 계절과 비교해야 한다(→ 개념 '비교 기준 정하기').

#### 다른 특별한 날
- 12/31 새해 전야 1,637건, 2/8 슈퍼볼 일요일 1,618건, 3/17 성 패트릭의 날 1,348건: 모두 겨울·초봄이라 1년 평균보다 낮다.
- 7/4 독립기념일 3,506건, 7/5 3,298건: 여름이라 높다.
- 6/21 하지 무렵 일요일 5,350건: 1년 최고(→ 52번).

축제의 크기보다 **계절**이 소음 민원을 더 크게 좌우한다.
"""

method = """
1. 소음 민원의 하루 건수.
2. 1월 평일 하루 평균 = 1/2–1/31 중 월–금 날의 평균.
"""

caveats = """
- 새해 전야의 소음 일부는 자정을 넘겨 1월 1일로 잡힌다. 두 날을 합쳐 보는 것도 방법이다.
"""
