concepts = ["record_vs_person", "outlier", "proxy"]
related = [63, 64, 4]

background = """
#### 쓰고 싶은 문장
"브롱크스는 뉴욕에서 가장 시끄럽다." 근거: 소음 민원 1위(→ 64번).

#### 무엇이 문제인가
63번의 4.7만 건은 한 사람이 자동으로 반복 신고한 것일 수 있다. 그렇다면 그것은 '브롱크스 주민 4.7만 명의 불편'이 아니라
'한 사람의 4.7만 번 신고'다. **민원 1건 = 시민 1명이 아니다.**

#### 반복 신고를 어떻게 추정하나
공개 자료에는 신고자 ID가 없다. 대신 **같은 주소·같은 유형·같은 분(1분 안)**에 또 들어온 민원을 반복으로 추정했다.
- 전체 민원의 **3.6%**(143,600건)가 여기에 해당한다.
- 655 E 230th St에서는 **31%**가 같은 분 반복이다.

#### 그런데 이 추정도 섞여 있다
같은 분 반복이 가장 많은 유형은 소음이 아니라 HPD 주택 민원(비위생 상태, 페인트·회벽, 배관 등)이다. 그 유형의 20% 넘게가 같은 분 반복이다.
들여다보면 한 번의 신고가 문제 부위마다(벽, 천장, 라디에이터) **따로 기록**된 것이다. 반복 신고자가 아니다.
그래서 3.6%는 '반복 신고자'와 '한 신고의 여러 기록'이 섞인 값이다. 소음만 보면 주거 소음의 3.9%가 같은 분 반복이다.
"""

method = """
1. 주소가 있는 민원을 (정규화 주소, 유형, 접수 시각을 분 단위로 내림)으로 묶었다.
2. 묶음 안에서 첫 건을 뺀 나머지를 '같은 분 반복'으로 셌다.
"""

caveats = """
- 1분이라는 기준은 임의다. 5분, 1시간으로 바꾸면 비율이 달라진다.
- 큰 건물에서는 여러 세대가 같은 분에 같은 문제를 신고할 수 있다(난방 중복, → 4번).
"""
