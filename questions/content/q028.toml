concepts = ["accountability", "reported_vs_occurred"]
related = [25, 27]

background = """
#### 쓰고 싶은 문장
"AOC 지역구 민원이 가장 많다. AOC가 일을 못한다."

#### 무엇이 틀렸나
311 민원은 모두 **뉴욕시 기관**이 처리한다. 경찰(NYPD)이 43%로 가장 많고, 주택보존개발국(HPD), 위생국(DSNY), 교통국(DOT) 순이다.
연방 하원의원은 쓰레기 수거, 난방 단속, 불법주차 단속 권한이 없다. 연방 법과 예산을 다룬다.
민원 숫자를 그 일에 권한이 없는 사람에게 붙이는 것은 **데이터를 엉뚱한 책임자에게 연결하는 오용**이다.

#### 그럼 누구의 성적표인가
- 처리 속도·처리 방식: 해당 **기관**과 그 기관을 지휘하는 **시장**
- 예산 배분·기관 감독: **시의회**와 지역구 시의원
- 민원의 양 자체: 그 동네의 문제와 신고 성향이 섞인 값(→ 4부)

#### 연방 의원이 할 수 있는 일
연방 의원 사무실도 주민 민원(사회보장, 이민, 재향군인 등 연방 업무)을 받는다. 다만 이것은 311과 다른 창구다.
"""

method = """
1. `Agency` 열로 민원을 처리 기관별로 셌다(12개월 전체).
"""

caveats = """
- 같은 논리로 '시의원 성적표'도 조심해야 한다. 시의원은 민원을 직접 처리하지 않는다.
"""
