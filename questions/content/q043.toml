concepts = ["majority_group", "confounding", "reported_vs_occurred"]
related = [33, 41, 42]

background = """
#### 질문
아시아계 다수 Tract(133개)의 1,000명당 민원은 341건으로 다섯 집단 중 가장 적다. 왜일까?

#### 데이터만으로는 모른다
가설은 여럿이다.
- **자가 비율**: 자기 집이면 집 안 문제를 직접 고친다.
- **언어 장벽**: 영어가 서툴면 신고 경로가 좁다.
- **행정 신뢰**: 정부에 연락하는 문화·경험의 차이.
- **실제로 문제가 적음**: 건물이 새것이거나 관리가 잘 될 수도 있다.

#### 프로필로 걸러 보기
| | 아시아계 다수 | 백인 다수 | 흑인 다수 | 히스패닉 다수 |
|---|---|---|---|---|
| 임차율 중앙값 | 55% | 57% | 57% | 87% |
| 중위 가구소득 중앙값 | 약 7.4만 달러 | 약 11.5만 달러 | 약 7.8만 달러 | 약 5.3만 달러 |
| 전화 신고 비율 | 22.5% | 20.5% | 29.3% | 27.0% |

- 아시아계 다수 동네의 임차율은 백인·흑인 다수 동네와 **거의 같다**. 자가 비율만으로는 설명이 약하다.
- 소득은 흑인 다수 동네와 비슷한데 민원은 훨씬 적다.
- 전화 비율도 특별히 높지 않다. '전화로라도 신고한다'는 흔적은 없다.

남는 후보는 언어·신뢰, 혹은 실제로 문제가 적음이다. 이 중 무엇인지 가리려면 42번의 결합(영어 능력)과 문제를 직접 재는 자료가 필요하다.
**"모른다"고 쓰는 것도 데이터 저널리즘이다.**
"""

method = """
1. 33번의 과반 집단별 1,000명당 민원.
2. 집단별 Tract 중위 가구소득·임차율의 중앙값, 신고 경로 중 전화 비율.
"""

caveats = """
- '아시아계'는 중국·한국·인도·방글라데시계 등 매우 다양한 집단을 하나로 묶은 것이다. 동네마다 사정이 다르다.
- 아시아계 다수 Tract는 133개로 적고, 퀸스(플러싱 등)와 브루클린(선셋파크 등)에 몰려 있다.
