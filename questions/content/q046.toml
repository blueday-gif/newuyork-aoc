join_status = "방법만 정리함. ACS 2015–2019 5개년을 아직 받지 않아 '젠트리피케이션 중'이라는 변화를 잴 수 없다."

background = """
#### 연구
BuzzFeed News(2018)와 Pospisil 등의 분석은 젠트리피케이션이 진행 중인 저소득 Tract에서 소음 민원이 약 14% 더 많다고 보고했다.
새로 이사 온 고소득 주민이 기존 주민의 생활 소음(음악, 모임, 길거리 활동)을 신고한다는 해석이다.

#### 왜 지금은 못 하나
젠트리피케이션은 상태가 아니라 **변화**다. "10년 사이 소득·학력·임대료가 빠르게 오른 저소득 동네"를 고르려면
겹치지 않는 두 시점의 ACS(2015–2019와 2020–2024)가 필요하다. 지금은 2020–2024 한 시점뿐이다.

#### 지금 보이는 것
소득 하위 두 분위(Q1–Q2) Tract 871개만 모아도, 1,000명당 소음 민원은 상위 25% 동네가 하위 25%의 약 3배다.
같은 '저소득 동네'라도 소음 민원이 크게 다르다. 이 차이 가운데 '젠트리피케이션 중'이 얼마를 설명하는지가 질문이다.
"""

method = """
**지금 한 것**: 소득 Q1–Q2 Tract의 자치구별 1,000명당 소음 민원 사분위수.

**결합 방법(다음 단계)**
1. ACS 2015–2019 5개년을 같은 변수(소득, 학력, 임대료, 인종)로 받는다.
2. 2010 Tract → 2020 Tract 대응표로 경계를 맞춘다.
3. 젠트리피케이션 정의를 정한다. 예: 처음에 시 중위 소득 이하였고, 학사 이상 비율과 중위 임대료 상승이 상위 3분의 1.
4. 저소득 Tract를 '젠트리피케이션 중'과 '아님'으로 나눠 소음 민원율을 비교하고, 임차율·밀도를 통제한다.
"""

caveats = """
- 정의에 따라 '젠트리피케이션 동네' 목록이 크게 바뀐다. 두세 가지 정의로 결과가 같은지 본다.
"""

