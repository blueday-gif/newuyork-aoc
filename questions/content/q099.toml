join_status = "결합함(2026-11-27). 표가 있는 4,030개 ED의 표 99.8%를 분석 대상 Tract로 옮겼다. 세대 수로 나눈 득표율과 면적으로 나눈 득표율은 거의 같고(ρ 1.00, 차이 중앙값 0.23%p), 차이는 일부 Tract에 몰린다(최대 16.2%p). 보간 방식이 대부분의 동네에서 결론을 바꾸지는 않지만, 사람이 고르게 살지 않는 곳의 숫자는 크게 틀릴 수 있다."

background = """
#### 공간 보간으로 합친다
선거 결과는 투표구(Election District, ED) 단위로 나오고, ED 경계는 Census Tract와 맞지 않는다.
그래서 ED의 득표를 Tract로 옮길 때 겹친 **면적**이나 **인구** 비율로 나눠 붙인다(→ 개념 '경계 겹치기'). 이것을 공간 보간이라고 한다.

#### 311 안의 선거 관련 열
311에는 **시의회 선거구**(Council District) 열이 있다(→ 27번). 하지만 시장 선거 개표가 나오는 투표구(ED)는 없다.

#### 무엇을 물을 수 있나
"민원과 표가 같은 동네의 성격에서 나오는가?" 맘다니 득표율과 민원율은 둘 다 임차율을 따라간다.
임차율 5분위마다 1,000명당 민원은 343 → 376 → 439 → 482 → 559건으로 오른다(→ 16번). 표도 비슷한 모양일 것이다.
그래서 표와 민원의 관계는 **임차율이 비슷한 동네끼리** 봐야 한다(→ 17번).
그리고 어떤 결과가 나와도 '민원에 지친 사람이 그 후보를 뽑았다'고 말할 수는 없다(→ 18번, 생태학적 오류).
"""

method = """
**결합 방법(Phase 3B에서 실행)**
1. 선관위 ED별 시장 개표와 시 계획국 ED 경계(nyed_25c)를 받았다. 선거구 번호는 AD 두 자리 + ED 세 자리(예: 77001)로 맞춘다. 다른 ED에 합쳐 집계된 221곳은 표가 0이다.
2. Census Block 인구 대신 PLUTO 필지의 주거 세대 수로 ED의 표를 Tract에 나눴다. 세대가 없는 ED 75곳만 면적으로 나눴다.
3. 비교를 위해 모든 ED를 면적으로만 나눈 득표율도 만들고, 두 방법의 차이를 Tract별로 구했다.
4. '주민 1,000명당 표'는 투표율이 아니다. 분모가 유권자가 아니라 전체 인구다.
"""

caveats = """
- 투표율이 낮은 동네의 득표율은 소수 유권자의 선택이다. 득표율과 함께 투표율도 붙인다(→ 31번).
"""
