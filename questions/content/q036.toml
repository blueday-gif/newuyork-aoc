concepts = ["stratification", "quintile", "heat_season"]
related = [35, 37, 7]

background = """
#### 소득을 맞추면
Tract를 소득 5분위와 히스패닉 비율 5분위로 함께 나눠, 25칸마다 임차가구 1,000가구당 난방 민원을 구했다.
같은 소득 분위 **안에서** 히스패닉 비율에 따라 민원이 달라지는지 보는 것이다.

#### 결과
- **소득 최하위 분위**에서는 히스패닉 비율 최하위 104건, 최상위 255건으로 **2.5배**다.
- 소득 중간(Q2–Q3)에서는 차이가 있지만 줄어들고, **소득 상위(Q4·Q5)에서는 차이가 사라진다.**

**가난과 히스패닉 밀집이 겹치는 곳에서만** 난방 민원이 튄다.

#### 해석
소득만으로도, 히스패닉 비율만으로도 설명되지 않는다. 두 조건이 겹친 동네(브롱크스 남부, 맨해튼 북부 일부 등)에
난방이 자주 끊기는 오래된 대형 임대 건물이 몰려 있을 가능성이 있다. 건물 단위 자료(HPD 위반, 건축연도)로 확인해야 한다.
"""

method = """
1. 분모는 인구가 아니라 **임차가구 수**다. 난방은 집주인 책임이라 세입자 가구가 맞는 분모다.
2. 소득 5분위 × 히스패닉 비율 5분위 = 25칸. 칸별 난방 민원(12개월) ÷ 칸별 임차가구 합 × 1,000.
3. 칸마다 Tract 수가 다르다(표 참고). 소득 상위·히스패닉 최상위 칸처럼 Tract가 적은 칸은 숫자가 불안정하다.
"""

caveats = """
- 5분위는 거칠다. 같은 분위 안에서도 소득 차이가 남는다.
- 히스패닉 다수 동네는 브롱크스에 많다. 자치구(관리·점검 체계) 차이가 섞였을 수 있다.
"""
