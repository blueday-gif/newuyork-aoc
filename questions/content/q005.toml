concepts = ["definition", "concentration", "bbl"]
related = [4, 6, 7, 69]

background = """
#### 감사관 보고서 "Turn Up the Heat"
뉴욕시 감사관실은 난방 민원이 해마다 같은 건물에서 반복된다는 점을 짚었다.
"매 시즌 5회 넘게 신고된 건물"이 1.5%라는 숫자는 **2017–2021 다섯 시즌 내내** 그 조건을 넘긴 건물이다.

#### 우리 숫자는 왜 28.4%인가
우리는 **한 시즌**(2025-11 ~ 2026-05)만 봤다. 한 해만 5회를 넘기는 건물은 훨씬 많다.
게다가 분모도 다르다. 우리는 '그 시즌에 한 번이라도 신고된 건물'(36,225동)을 분모로 썼다.
뉴욕시 전체 주거 건물을 분모로 쓰면 비율은 훨씬 작아진다.

#### '연속'이라는 조건의 힘
한 시즌 안에서도 "7개월 내내 매달 신고된 건물"로 조건을 바꾸면 1.5%(550동)로 떨어진다.
감사관과 같은 1.5%가 나온 것은 **우연의 일치**다. 정의가 다르므로 같은 것을 잰 것이 아니다.
다만 조건을 '연속'으로 바꾸면 숫자가 이렇게 줄어든다는 감각을 얻을 수 있다.

#### 그래도 요지는 같다
5회 초과 건물 10,276동이 난방 민원의 83.7%를 낸다. "문제는 소수 건물에 반복된다"는 보고서의 요지는 그대로 확인된다.
"""

method = """
1. 2025-11 ~ 2026-05 `HEAT/HOT WATER` 중 BBL이 있는 민원을 건물(BBL)별로 셌다.
2. k = 1, 2, 3, 5, 10, 20, 50마다 'k회 초과 건물 비율'과 '그 건물들의 민원 몫'을 구했다.
3. 건물별로 민원이 있었던 달의 수(1–7개월)를 셌다.
"""

caveats = """
- BBL은 필지 번호라서 큰 단지는 여러 동이 하나로 묶인다. 민원 상위 '건물'에는 이런 단지가 많다.
- 분모가 '신고된 건물'이라서, 한 번도 신고되지 않은 건물은 계산에 들어오지 않는다.
"""

