#### 바로 계산할 수 없는 이유
311 원본에는 시의회 선거구(Council District)는 있지만 **연방 하원 선거구는 없다**.
인구조사국 TIGER의 119대 의회 선거구(CD119) 경계를 받아 Tract와 겹쳐야 한다(→ 개념 '경계 겹치기').

#### 대리 지표로 본 모습
NY-14와 인구 구성이 비슷한 동네로 **히스패닉 비율 최상위 20% Tract**(약 47% 이상)를 골라 시 전체와 비교했다.
1,000명당 민원은 536건으로 시 전체(449건)보다 많고, 구성에서는 소음과 주거환경의 비중이 크다.
이 결과는 4부(인종·소득·세입자)와 이어진다.
