join_status = "311과 무관한 결합 연습이다. RGB 역대 인상률 표와 시장 재임기를 아직 붙이지 않았다. 해설만 있다."

background = """
#### 판결
2026년 7월 22일 집주인 7명이 RGB를 상대로 소송을 냈고, 11월 25일 맨해튼 법원 Brendan Lantry 판사가 기각했다.
동결은 유지됐지만, 판사는 권한 없이 동결을 약속한 것은 무책임하다며 시장을 비판했다. 항소 가능성이 남아 있다.

#### 시장에게 권한이 없다는 뜻
인상률은 RGB가 표결로 정한다. 시장은 위원 9명을 **임명**할 뿐 표결하지 않는다.
그래서 "동결하겠다"는 약속은 법적으로는 '동결에 찬성할 위원을 임명하겠다'는 뜻에 가깝다.

#### 두 데이터 합치기 연습
RGB는 1969년부터 해마다 1년·2년 계약 인상률을 공개한다. 여기에 **역대 시장 재임 기간**을 붙이면
"시장이 바뀌면 인상률이 달라졌나"를 그려 볼 수 있다. 열쇠는 '연도'다.
- RGB 표: 연도, 1년 인상률, 2년 인상률
- 시장 표: 시장 이름, 취임일, 퇴임일
- 결합: 표결 연도가 어느 시장 재임기에 속하는지 붙인다.
"""

method = """
**결합 방법(다음 단계)**
1. RGB 웹사이트의 역대 가이드라인 표(Apartment Orders)를 옮긴다.
2. 역대 시장 재임기 표를 만든다.
3. 표결이 6월이므로 '그해 6월 1일에 재임 중인 시장'을 붙인다.
4. 시장별 평균 인상률과, 연도별 선 그래프에 재임기를 배경 띠로 겹친 그림을 그린다.
"""

caveats = """
- 인상률은 물가·연료비·금리에 크게 좌우된다. 시장 효과를 보려면 같은 해 물가 상승률(CPI)과 나란히 놓는다.
- 위원 임기가 겹쳐서 새 시장 취임 첫해에는 전임 시장이 임명한 위원이 많다.
"""

