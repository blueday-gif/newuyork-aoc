concepts = ["did", "rent_stabilization", "bbl", "data_join", "seasonality"]
related = [13, 14, 24]
lab = "did_containerization"
join_status = "방법만 정리함. RGB 안정화 건물 목록은 아직 붙이지 않았다. 동결 뒤 자료도 한 달뿐이다. 같은 이중차분 설계를 쓰레기통 의무화(2024-11-12, 1~9세대 건물) 실제 311 자료로 아래 '직접 해 보기'에서 움직여 볼 수 있다."

background = """
#### 동결 효과를 재는 가장 깨끗한 방법
동결은 **안정화 아파트에만** 적용된다. 같은 도시, 같은 날씨를 겪는 비안정화 건물이 자연스러운 비교 집단이 된다.
두 집단 모두 겨울이 오면 난방 민원이 늘지만, 동결이 관리에 영향을 줬다면 안정화 건물 쪽만 **더** 늘거나 덜 늘 것이다.
이 '차이의 차이'가 이중차분이다.

#### 필요한 자료
- **RGB 안정화 건물 목록**: 안정화 아파트가 한 채라도 있는 건물의 주소와 BBL. 해마다 공개된다.
- **311 HPD 주거 민원**: 우리 데이터의 HPD 민원은 99.7%에 BBL이 있어 연결이 쉽다.
- **시간**: 동결 뒤 한 시즌(2026-10 ~ 2027-05)이 쌓여야 의미 있는 비교가 된다.

#### 미리 할 수 있는 것: 평행 추세 점검
동결 전 11개월(2025-11 ~ 2026-09) 동안 두 집단의 월별 민원 선이 **나란히** 움직였는지 그려 본다.
나란하지 않으면 동결이 없어도 두 집단이 달리 움직였다는 뜻이라 이중차분 결과를 믿기 어렵다.
"""

method = """
**지금 한 것**: HPD 주거 민원(12개월)을 월별로 '난방·온수'와 '그 밖'으로 나눠 동결 전 기준선을 그렸다.

**결합 방법(다음 단계)**
1. RGB 건물 목록을 받아 BBL을 10자리 문자열로 맞춘다.
2. 311 HPD 민원에 '안정화 건물' 표시를 붙인다(BBL 일치).
3. 건물당(또는 세대당) 월별 민원을 두 집단으로 나눠 그린다. 세대 수는 PLUTO의 `UnitsRes`.
4. 동결 전 11개월의 평행 추세를 확인한다.
5. 2027년 봄, 동결 후 시즌과 전 시즌의 변화량 차이를 구한다.
"""

caveats = """
- 안정화 건물과 비안정화 건물은 원래 다르다(나이, 크기, 동네). 그래서 '수준' 비교가 아니라 '변화' 비교를 한다.
- 동결은 계약 갱신 때 적용되므로 효과는 1–2년에 걸쳐 서서히 나타난다.
- 한 건물에 안정화·비안정화 아파트가 섞여 있으면 건물 단위 구분이 흐려진다.
"""

