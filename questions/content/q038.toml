concepts = ["reported_vs_occurred", "per_capita", "quintile"]
related = [39, 23, 40]

background = """
#### 쥐 민원
뉴욕의 쥐 민원은 보건국(DOHMH)이 받는다. 12개월 26,026건으로, '쥐를 봤다'(Rat Sighting)가 3분의 2이고
'쥐를 끄는 조건'(쓰레기, 먹이), '쥐 흔적', '생쥐를 봤다'가 뒤를 잇는다.

#### 결과는 반대 방향
- 1,000명당 쥐 민원은 소득 최하위 2.8건, 최상위 3.5건으로 **부유할수록 조금 많다.** 다른 민원(주거, 소음)과 반대다.
- 자치구로는 **맨해튼**이 10만 명당 387건으로 1위, 브루클린 360건, 브롱크스 285건 순이다.
- Tract 빈곤율과 해충·동물 분야 민원은 약한 음의 관계(−0.08)다.

#### 맨해튼이 1위인 이유(가설)
맨해튼은 식당과 쓰레기 봉투가 길에 많고, 유동 인구가 많아 쥐를 '보는' 사람도 많다.
게다가 쥐 민원은 집 안보다 거리·공공장소 문제라, 그 동네에 사는 사람만 신고하는 것이 아니다.
"""

method = """
1. `Problem = "Rodent"`를 Tract에 붙여 소득 5분위별 1,000명당.
2. 자치구별은 원본 자치구 열로 세어 자치구 인구로 나눴다(10만 명당).
3. Tract 빈곤율과 해충·동물 분야 1인당 민원의 Spearman 상관. 쥐만 보면 +0.06이다.
"""

caveats = """
- 민원이 많다고 쥐가 많다는 뜻은 아니다(→ 39번).
- 거리 문제는 거주 인구가 분모로 맞지 않을 수 있다. 상업 지구의 1인당 수치가 커진다.
"""

