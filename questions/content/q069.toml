concepts = ["gini", "concentration", "outlier"]
related = [70, 73, 63, 5]

background = """
#### 쏠림의 도시
1년 동안 민원이 들어온 주소는 592,939곳이다.
- 그중 **43%**(254,808곳)는 1년에 딱 **한 번** 신고됐다.
- **상위 1%** 주소(5,929곳)가 전체 민원의 **30.1%**를 차지한다.
- 상위 0.1%만으로 11%, 상위 10%가 65%다.
- 지니 계수는 **0.72**로, 소득 불평등이 심한 나라보다도 쏠려 있다.

#### 무엇이 상위에 있나
1위는 63번의 655 E 230th St(47,105건)다. 상위 10곳에는 같은 주소에서 같은 유형(소음, 불법주차)이 100% 가까이 나오는 곳이 많다.
반복 신고자, 큰 건물, 장소형 주소(공항, → 73번)가 섞여 있다.

#### 왜 중요한가
쏠림이 크다는 것은 **정책 대상을 좁힐 수 있다**는 뜻이다. 상위 1% 주소를 이해하면 민원의 3분의 1을 이해할 수 있다.
동시에, 한두 주소가 동네·자치구 통계를 흔들 수 있다는 경고이기도 하다(→ 11, 27, 64번).
"""

method = """
1. 주소를 대문자·공백 정리했다. 주소가 빈 민원은 뺐다.
2. 주소별 민원 수를 큰 순서로 줄 세워 누적 비율(집중 곡선)을 그렸다.
3. 지니 계수 = 로렌츠 곡선과 대각선 사이 넓이 × 2.
"""

caveats = """
- 같은 건물이 다른 표기('1040B EAST 217 STREET', '1040 E 217 ST')로 들어오면 다른 주소로 잡힌다. BBL로 묶으면 쏠림이 조금 달라진다.
- 큰 아파트 단지 주소는 세대 수만큼 민원이 많은 것이 자연스럽다. 세대 수(PLUTO)로 나눈 쏠림은 다를 수 있다.
"""
