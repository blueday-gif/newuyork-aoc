background = """
#### 독립기념일
7월 4일 밤 뉴욕은 메이시스 불꽃놀이로 유명하지만, 개인이 터뜨리는 불꽃놀이는 뉴욕주에서 불법이다.
311에는 '불법 불꽃놀이(Illegal Fireworks)' 유형이 따로 있고 경찰이 처리한다.

#### 결과
- 1년 동안 불법 불꽃놀이 민원은 10,891건이다.
- 그중 41%(4,479건)가 **7월 3–5일 사흘**에 몰린다. 7월 4일 하루 2,257건, 5일 1,688건, 3일 534건이다.
- 같은 날 소음 민원은 3,506건으로 평균의 1.6배다.

