background = """
#### MODA의 사례
뉴욕시 시장 데이터분석실(MODA)은 여러 기관 자료를 합쳐 **불법 개조** 위험 건물을 찾는 모델로 알려졌다.
세금 체납, 저당권 설정, 311 건축 민원 같은 신호가 겹치는 건물을 먼저 점검하자, 점검원이 실제 위반을 찾는 비율이 크게 올랐다고 소개된다.
불법 개조는 지하실·차고를 몰래 주거로 바꾸거나 한 집을 여러 칸으로 쪼개는 것으로, 화재 때 탈출이 어려워 인명 피해로 이어진다.

#### 311에서 보이는 것
건축국(DOB) 민원 중 세부 유형에 '불법 개조(Illegal Conversion)'가 들어간 것이 16,547건이다. 거의 전부가 주거 공간 개조다.
10만 명당으로 보면 **퀸스**가 413건으로 압도적이다. 스태튼아일랜드 167건, 브루클린 133건, 브롱크스 115건, 맨해튼 62건 순이다.
퀸스에는 단독·2세대 주택의 지하를 세놓는 경우가 많다고 알려져 있다.

#### 붙일 자료
- **세금 체납 목록(Tax Lien Sale)**: 재무국이 해마다 체납 필지 목록을 공개한다(BBL).
- **저당 정보(ACRIS)**: 부동산 거래·저당 기록(BBL).
- **DOB 위반·점검 결과**: 실제로 불법 개조가 확인됐는지.
"""

method = """
**지금 한 것**: 세부 유형에 'Illegal Conversion'이 들어간 민원의 자치구별 10만 명당.

**결합 방법(다음 단계)**
1. DOF Tax Lien Sale 목록, ACRIS 저당 기록을 BBL로 받는다.
2. 불법 개조 민원 BBL과 겹치는 비율을 보고, 겹치는 건물의 DOB 점검 결과(위반 확인 비율)를 비교한다.
"""

