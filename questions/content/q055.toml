concepts = ["seasonality", "baseline"]
related = [1, 2, 56, 89]

background = """
#### 결과
1년 중 311 민원이 가장 많은 날은 **2026년 2월 24일**(22,805건)이고, 그중 절반이 눈·얼음 민원이다. 하루 평균(10,860건)의 2.1배다.
상위 날들에는 1월 26–28일도 있다. 1월 말의 눈과 한파로 눈·얼음과 난방 민원이 함께 몰렸다.

#### 가장 적은 날
가장 적은 날은 **2025년 11월 1일**(1,734건)이다. 그날 민원이 적었던 것이 아니라, 이 자료가 그날 **저녁 9시부터만** 담겨 있기 때문이다.
자료의 시작과 끝은 늘 이렇게 잘린다(→ 89번). 하루 단위 순위를 매길 때는 첫날과 마지막 날을 먼저 확인한다.

#### 큰 날을 만드는 것
1년에 며칠 안 되는 날씨 사건(폭설, 한파)이 가장 큰 봉우리를 만든다. 311 업무량을 계획할 때 '평균'보다 이런 날이 중요하다.
"""

method = """
1. 전체 민원의 하루 건수(접수일 기준).
2. 상위 10일마다 그날 1위 유형과 그 몫.
"""

caveats = """
- 자료 범위는 2025-11-01 21시 ~ 2026-10-31 21시다. 첫날과 마지막 날은 하루가 다 들어 있지 않다.
"""
