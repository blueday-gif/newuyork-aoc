concepts = ["per_capita", "outlier", "definition"]
related = [1, 2, 64]

background = """
#### 건수 1위는 브루클린
1년 민원 건수는 브루클린이 약 122만 건으로 1위, 퀸스 97만, 브롱크스 83만, 맨해튼 77만, 스태튼아일랜드 16만 건 순이다.
그런데 브루클린은 인구도 1위(약 263만 명)다.

#### 1,000명당으로는 브롱크스
인구로 나누면 브롱크스가 1위로 올라온다. 맨해튼 474건, 브루클린 465건, 퀸스 416건, 스태튼아일랜드 327건이다.
- 자치구 열로 세면 브롱크스는 **594.1건**이다.
- 원문은 민원 위치(좌표)를 Tract에 붙여 그 Tract의 자치구로 셌다. 그러면 **583.9건**이다. 좌표가 없는 민원이 빠지기 때문에 조금 작다.
- 63번의 한 주소를 빼도 560.5건으로 여전히 1위다.

#### 교훈
'어디가 가장 많나'는 **건수**와 **비율** 중 무엇을 묻는지에 따라 답이 다르다. 같은 비율도 세는 방식(자치구 열 vs 좌표)에 따라 조금 달라진다.
숫자를 쓸 때는 분모와 세는 방식을 함께 적는다.
"""

method = """
1. 원본 `Borough` 열로 자치구별 건수.
2. ACS 2024 5개년 자치구 인구로 나눈 1,000명당.
3. 비교: 좌표를 Tract에 붙이고 ACS의 자치구로 센 1,000명당(원문 방식), 655 E 230th St를 뺀 1,000명당.
"""

caveats = """
- 자치구가 'Unspecified'인 민원은 어느 쪽에도 들어가지 않는다.
