concepts = ["quintile", "median", "reported_vs_occurred", "compare_like"]
related = [9, 10, 33]

background = """
#### AEI 연구
Corinth와 Finley(2017, AEI)는 뉴욕 311 자료로 "부유한 동네의 노숙인 관련 신고에 경찰이 더 빨리 온다"고 분석했다.
차이는 약 33%였다.

#### 노숙인 야영지(Encampment) 민원
길이나 공원에 텐트·짐을 두고 머무는 곳을 신고하는 유형이다. 이번 12개월에는 약 3분의 2를 경찰(NYPD),
나머지를 노숙인서비스국(DHS)이 맡았다. 아래 처리시간은 두 기관을 합친 값이다. 신고는 지원 요청이 되기도 하지만 **퇴거 요청**의 성격이 강하다.

#### 2026년에는
방향은 같다. 최상위 소득 분위 동네의 처리시간 중앙값이 최하위보다 약 19% 짧다(1.85시간 대 2.28시간).
그런데 더 큰 차이는 **건수**다. 최상위 분위의 신고가 최하위의 5.7배다.
처리 속도 차이보다 "누가 신고하는가"의 차이가 훨씬 크고, 신고가 많은 곳에서 퇴거 압력이 커진다.
"""

method = """
1. 민원 위치를 Census Tract(GEOID)에 붙였다. 인구 1,000명 미만 Tract와 위치를 못 찾은 민원은 빠진다.
2. Tract를 중위 가구소득 순으로 5분위로 나눴다(ACS 2024 5개년).
3. `Problem = "Encampment"`의 분위별 건수와 처리시간 **중앙값**.
4. 10만 명당 = 분위 건수 ÷ 분위 인구 합 × 100,000.
"""

caveats = """
- 처리시간 '종결'은 경찰이 현장에서 무엇을 했는지 알려 주지 않는다(→ 3번).
- 소득 분위는 동네 단위다. 신고한 사람이 부유하다는 뜻이 아니다. 부유한 업무 지구(맨해튼 미드타운 등)에는 낮에 많은 사람이 다닌다.
- 같은 유형 안에서만 비교했다. 다른 유형은 방향이 다르다(→ 9번).
"""

