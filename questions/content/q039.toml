concepts = ["underreporting", "proxy", "contacting_propensity", "data_join"]
related = [38, 37, 7]

background = """
#### 쓰고 싶은 문장
"쥐 민원은 부자 동네가 더 많다. 가난한 동네에는 쥐가 적다."

#### 왜 틀릴 수 있나
신고 수는 쥐의 수가 아니라 **쥐를 보고 신고한 사람의 수**다. 쥐를 일상으로 여기거나 신고해도 소용없다고 느끼면 신고하지 않는다.
그러니 '실제 쥐 문제'를 따로 재야 한다. 보건국은 신고와 별개로 정기 점검도 하고, 결과를 쥐 정보 포털(Rat Information Portal)에 공개한다.

#### 311 안의 대리 지표
쥐 민원 가운데 점검까지 간 건은 결과문이 '위반 발견' 또는 '통과(위반 없음)'로 끝난다. 그 비율을 소득 5분위별로 봤다.
- 소득 최하위 동네의 신고는 점검했을 때 **73%**에서 위반이 나왔다.
- 소득 최상위 동네는 **57%**다. 분위가 오를수록 꾸준히 낮아진다.

가난한 동네의 신고는 **더 자주 '진짜'**다. 신고 1건 뒤에 더 큰 문제가 있다는 뜻이고, 신고 수가 적은 것은 문제가 적어서가 아니라
신고 성향의 차이일 가능성이 크다. 이 데이터에서 가장 좋은 '과소신고' 이야기 소재다.

#### 확실히 하려면
쥐 정보 포털의 **정기 점검**(신고와 무관한 점검) 결과를 Tract에 붙여, 활동 흔적 비율과 신고율을 나란히 놓는다.
"""

method = """
1. 쥐 민원 결과문을 규칙으로 분류했다: '위반 발견'(found violations, minor violations), '위반 없음(통과)', '중복(앞선 신고)', '점검 못 함', 기타.
2. 점검 결과가 있는 민원(위반 발견 + 통과)만 분모로, 소득 5분위별 위반 발견 비율.
"""

caveats = """
- 점검이 '신고 받은 곳'에만 갔으므로 표본이 신고에 묶여 있다. 신고와 독립된 정기 점검 자료가 더 좋은 기준이다.
- 위반은 건물 소유자 책임 기준이라, 거리의 쥐는 위반으로 잡히지 않을 수 있다.
"""

