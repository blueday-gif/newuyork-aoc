concepts = ["compare_like", "median", "quintile"]
related = [8, 3, 82]

background = """
#### 8번을 일반화하면 틀린다
8번에서 야영지 민원은 부유한 동네가 조금 더 빨리 닫혔다. 그렇다면 부자 동네는 모든 민원을 빨리 처리받을까?
난방은 반대다. 최하위 분위 39.9시간, 최상위 47.7시간으로 **부유한 동네가 더 느리다**.

#### 왜 유형마다 다른가
처리시간은 그 유형을 맡은 **기관의 업무 방식**에 크게 좌우된다.
- 불법주차·소음은 경찰이 순찰 중에 들러서 몇 시간 안에 닫는다.
- 난방은 HPD가 집주인에게 연락하고, 점검원 일정을 잡고, 다시 확인한다. 하루 이틀 걸린다.
- 동네마다 건물 크기, 관리 회사 유무, 점검원 배치가 다르다.

그래서 처리 속도의 형평성은 **같은 유형 안에서만** 말할 수 있다. 여러 유형을 섞으면
"부유한 동네에 빨리 닫히는 유형이 많아서" 생기는 차이가 "부유한 동네가 우대받는다"로 보인다.

#### 차트 읽기
각 유형의 최하위 분위를 100으로 맞췄다. 선이 오른쪽으로 내려가면 부유할수록 빠르고, 올라가면 느리다.
세로축을 '처리시간 중앙값'으로 바꾸면 유형 사이의 절대 시간 차이를 볼 수 있다.
"""

method = """
1. 8번과 같이 민원을 Tract와 소득 5분위에 붙였다.
2. 네 유형(야영지, 난방·온수, 불법주차, 주거 소음)마다 분위별 처리시간 **중앙값**.
3. 지수 = 그 분위 중앙값 ÷ 같은 유형 최하위 분위 중앙값 × 100.
"""

caveats = """
- 중앙값만 봤다. 오래 걸리는 꼬리(상위 10%)는 다른 모양일 수 있다.
- 난방이 부유한 동네에서 느린 이유는 이 자료로 확정할 수 없다. 큰 건물의 중복 처리, 점검 순서 같은 가설을 따로 확인해야 한다.
"""
