background = """
#### 임대료 동결
2026년 6월 임대료가이드라인위원회(RGB)는 7대 1로 안정화 아파트 약 100만 호의 1년·2년 계약 임대료를 동결했다.
2년 계약 동결은 1969년 위원회가 생긴 뒤 처음이다. 집주인 쪽 위원은 표결 직전 사임했다.
동결은 **2026년 10월 1일 이후 시작하는 계약**부터 적용된다.

#### 10월 난방 민원
10월 한 달 난방 민원은 26,338건이다. 주별로 937 → 3,575 → 6,197 → 10,627건으로 가파르게 오른다.
하루 단위로 보면 10월 1일 당일은 229건으로 9월 말과 다르지 않다. 크게 뛰는 날은 10월 6–7일과 17일 이후다.

#### 왜 하필 10월 1일인가
10월 1일은 법정 **난방 시즌**이 시작되는 날이기도 하다. 이날부터 집주인은 실내 최저 온도를 지켜야 하고,
세입자는 난방 민원을 낼 근거가 생긴다. 동결 적용일과 난방 시즌 첫날이 겹친 것은 우연이지만,
이 겹침 때문에 "동결 뒤 민원 급증"이라는 잘못된 해석이 쉽게 나온다(→ 14번).
"""

method = """
1. `HEAT/HOT WATER`의 접수일로 2026-09-01 ~ 10-31 하루 건수를 셌다.
2. 10월 주별은 ISO 주(월–일) 기준이다. 첫 주는 10/1(목)–10/4(일) 4일뿐이다.
"""

caveats = """
- 10월은 동결이 '시작된' 달이다. 동결은 계약 갱신 때 적용되므로 10월에 동결을 실제로 받은 세대는 일부다.
- 날마다 오르내림의 원인은 기온일 가능성이 크지만 이 페이지에서는 기온 자료로 확인하지 않았다(→ 57번).
"""

