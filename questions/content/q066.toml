background = """
#### SONYC
NYU 도시과학센터(CUSP)의 SONYC(Sounds of New York City) 프로젝트는 맨해튼·브루클린·퀸스 곳곳에 소음 센서를 설치해
소리의 크기와 종류(공사, 차량, 음악, 사이렌 등)를 기록했다. 일부 자료가 연구용으로 공개되어 있다.

#### 센서와 신고를 겹치면
같은 격자 칸에서 '센서가 잰 소리'와 '311 소음 신고'를 비교한다.
- 센서는 시끄러운데 신고가 적은 곳: **참고 사는 동네**(과소신고)
- 센서는 조용한데 신고가 많은 곳: **민감한 동네**(작은 소리에도 신고)
이 차이는 39번(쥐)과 같은 '과소신고' 질문을 소음에 대해 묻는 방법이다.

#### 지금 보이는 것: 넓이 기준
센서는 사람 수가 아니라 **자리**를 잰다. 그래서 311도 넓이로 나눠 봤다.
- ㎢당 소음 민원: 맨해튼 2,041건, 브롱크스 1,473건, 브루클린 844건, 퀸스 339건, 스태튼아일랜드 71건.
- 1,000명당으로는 브롱크스가 1위지만, 넓이로 나누면 **맨해튼**이 압도적이다.
무엇으로 나누느냐에 따라 '시끄러운 곳'의 지도가 바뀐다.
"""

method = """
**지금 한 것**: 자치구별 소음 민원 ÷ Tract 경계 면적 합(㎢), 그리고 ÷ 인구.

**결합 방법(다음 단계)**
1. SONYC 공개 자료(센서 위치, 시간대별 소음 수준·종류)를 받는다.
2. 센서 주변 반경(예: 200m) 또는 같은 격자 칸 안의 311 소음 민원을 센다.
3. 같은 시간대(예: 밤 10시 ~ 새벽 2시)로 맞춰 센서 값과 신고 수를 비교한다.
"""

caveats = """
- 면적은 Tract 경계 기준이라 물 위나 공원도 포함된다.
- 브롱크스 값에는 63번의 한 주소가 들어 있다.
- 센서는 수십 곳뿐이라 센서가 있는 칸만 비교할 수 있다.
"""

