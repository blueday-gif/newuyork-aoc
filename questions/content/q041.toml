concepts = ["digital_divide", "majority_group", "contacting_propensity"]
related = [31, 42, 43]

background = """
#### 311에 신고하는 세 가지 길
전화(311), 웹(portal.311.nyc.gov), 앱(NYC311). 앱과 웹은 사진과 위치를 붙이기 쉽고 24시간 바로 접수된다.
전화는 통역 서비스로 여러 언어를 지원한다.

#### 결과
- 소득 최하위 동네는 신고의 **27.0%**가 전화다. 최상위는 **19.1%**다.
- 흑인 다수 동네 **29.3%**, 히스패닉 다수 27.0%, 백인 다수 **20.5%**, 아시아계 다수 22.5%다.

저소득·흑인·히스패닉 다수 동네일수록 전화 비율이 높다. 웹과 앱 비율은 그만큼 낮다.

#### 왜 중요한가
경로마다 기록 방식이 다르다. 앱은 위치가 정확하고 사진이 붙지만, 전화는 상담원이 주소를 받아 적는다.
경로가 처리 방식이나 속도에 영향을 준다면 그 차이가 동네 차이로 나타난다. '앱이 없으면 신고도 없다'는 가설은 42번에서 다룬다.
"""

method = """
1. `Open Data Channel Type`(PHONE, ONLINE, MOBILE). 경로 미상(UNKNOWN, 약 8%)과 기타(0.1%)는 분모에서 뺐다.
2. 과반 집단·소득 5분위별 경로 비율.
"""

caveats = """
- 신고 경로는 기관이 기록한 값이다. 전화 상담원이 웹 양식에 대신 입력한 건이 'ONLINE'으로 잡힐 가능성은 확인하지 않았다.
"""
