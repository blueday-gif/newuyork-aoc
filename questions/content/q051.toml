concepts = ["report_time"]
related = [49, 50, 30]

background = """
#### 새벽 3시의 뉴욕
새벽 3시(3:00–3:59)에는 1년 동안 48,267건, 하루 평균 132건이 들어온다.
1위 **주거 소음**(12,490건), 2위 **불법주차**(8,026건), 3위 **난방·온수**(4,773건)다. 길거리 소음과 진입로 막힘이 뒤를 잇는다.

#### 오후 3시와 비교하면
같은 유형을 오후 3시와 나란히 놓으면 성격이 드러난다.
- 주거 소음은 새벽 3시(12,490건)와 오후 3시(12,948건)가 **거의 같다**. 한밤에도 낮만큼 들어온다.
- 길거리 소음과 상업 시설 소음은 새벽 3시가 오히려 많거나 비슷하다.
- 불법주차, 난방, 비위생 상태는 낮에 훨씬 많다. 집에 있는 시간, 기관 업무 시간과 함께 움직인다.

#### 왜 새벽에 난방인가
난방은 밤 10시 ~ 오전 6시에도 실내 62°F(약 17°C)를 지켜야 한다(→ 개념 '난방 시즌 규정'). 새벽에 추워 잠이 깬 세입자가 신고한다.
"""

method = """
1. 접수 시각이 3시대인 민원을 유형별로 셌다(1년 합계).
2. 같은 유형의 15시대 건수를 비교 열로 붙였다.
"""

caveats = """
- 앱·웹 신고는 문제를 발견한 뒤 나중에 올리기도 한다. 새벽 접수 일부는 낮에 본 문제일 수 있다.
"""
