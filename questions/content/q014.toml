background = """
#### 쓰고 싶은 문장
"동결 직후 난방 민원 급증. 집주인이 관리를 놓았다."

#### 왜 쓸 수 없나
10월 1일은 동결 적용일이면서 **난방 시즌 첫날**이다. 기온이 내려가면 난방 민원은 매년 오른다.
10월에 민원이 늘었다는 것만으로는 동결 때문인지 날씨 때문인지 가를 수 없다.
실제로 10월 1일 당일에는 아무 변화가 없고, 크게 오른 것은 보름 뒤다.

#### 무엇이 필요한가
- **작년 10월**: 같은 달을 1년 차이로 비교해야 계절이 지워진다. 우리 데이터는 2025년 11월부터라 없다.
  같은 원본(2020년 이후 311 자료)에서 2025년 10월과 그 전 해 10월을 추가로 뽑으면 된다.
- **기온**: 그해 10월이 유난히 추웠다면 작년과 비교해도 차이가 난다. 일별 최저기온을 함께 넣는다(→ 57번).
- **비교 집단**: 동결을 받지 않은 건물의 민원 변화와 비교한다(→ 15번, 이중차분).

#### 우리가 가진 두 시즌 초입
우리 자료의 양 끝은 2025년 11월과 2026년 10월로, 둘 다 시즌 초입이지만 **달이 다르다**.
그래서 차트의 두 선을 나란히 놓아도 비교가 되지 않는다. 그 점을 보여 주려고 그렸다.
"""

method = """
1. 월별: `HEAT/HOT WATER`를 접수 월로 셌다.
2. 두 시즌 초입: 2025-11-01부터 31일, 2026-10-01부터 31일의 하루 건수를 '경과일'로 맞춰 겹쳤다.
"""

