concepts = ["underreporting", "proxy", "hpd", "data_join"]
related = [36, 7, 39]
papers = ["kontokosta_heat"]
lab = "reporting_bias"

background = """
#### 두 주장
- Kontokosta 연구: 히스패닉·이민자 비율이 높은 동네는 **과소신고**한다.
- 36번: 히스패닉 비율이 높은 동네가 난방 민원을 **더 많이** 낸다.

#### 모순이 아니다
과소신고는 '신고가 적다'가 아니라 **'실제 문제에 비해'** 적다는 뜻이다. 분모가 다르다.
신고가 2.5배 많아도 실제 위반(HPD 점검)이 4배 많다면 과소신고다. 반대로 신고가 적어도 문제가 더 적으면 과소신고가 아니다.
그래서 판정하려면 신고와 독립된 위반 기록을 붙여야 한다(→ 7번).

#### 311 안의 대리 지표
311 결과문에 '위반이 발부됐다'는 문구가 있는 민원의 비율을 히스패닉 비율 5분위별로 봤다.
- 난방 민원(2025-11 ~ 2026-05, 임차가구당)은 히스패닉 최상위 분위가 최하위의 약 2.3배다.
- 그런데 신고 1건이 '위반 발부'로 닫히는 비율은 4.7–5.7%로 **분위마다 거의 같다.**

신고가 많은 동네에서 확인된 위반도 그만큼 많다는 뜻이다. "많이 신고하지만 근거 없는 신고가 많다"는 흔적은 없다.
과소신고인지는 이 지표로 판정할 수 없다. 위반 기록 전체를 건물 단위로 붙여야 한다.
"""

method = """
1. 2025-11 ~ 2026-05 난방 민원을 Tract와 히스패닉 비율 5분위에 붙였다.
2. 결과문을 HPD 규칙으로 분류했다(→ 4번). '위반 발부' 비율 = 위반 발부 ÷ 그 분위 난방 민원.
"""

caveats = """
- 결과문의 '위반 발부'는 위반 기록 자체가 아니다. 중복으로 닫힌 민원은 위반이 났어도 '중복'으로 분류된다.
- 히스패닉 비율 5분위는 소득을 맞추지 않았다. 36번처럼 소득 안에서 다시 볼 수 있다.
"""
