concepts = ["ecological_fallacy", "confounding"]
related = [17, 16, 45, 88]

background = """
#### 쓰고 싶은 문장
"맘다니 표가 많은 동네일수록 민원이 많다. 민원에 지친 시민이 맘다니를 뽑았다."

#### 무엇이 틀렸나
앞 문장은 **동네**에 대한 사실이고, 뒤 문장은 **사람**의 동기에 대한 주장이다.
동네 단위 상관은 그 동네 안의 누가 민원을 냈고 누가 투표했는지 알려 주지 않는다.
민원을 많이 낸 사람이 맘다니에게 투표하지 않았을 수도 있다. 이것이 **생태학적 오류**다.

#### 묶는 단위가 상관을 바꾼다
같은 관계(임차율과 민원율)를 묶는 단위만 바꿔서 계산했다.
- Tract 2,192개로 보면 0.34
- 임차율 5분위 묶음 5개로 보면 1.00
- 자치구 5개로 보면 1.00

크게 묶을수록 동네 안의 차이가 지워져 상관이 거의 완벽해진다. 점이 5개면 순서만 맞아도 순위 상관은 1이 된다.
"자치구 단위로 보니 완벽한 관계"라는 문장은 그래서 아무것도 말하지 않는다.
"""

method = """
1. Tract: 임차율과 1,000명당 민원의 Spearman 상관.
2. 5분위 묶음: 분위별 평균 임차율과 분위 민원율(분위 민원 합 ÷ 분위 인구 합)의 상관.
3. 자치구: 인구 가중 임차율과 자치구 민원율의 상관.
"""

caveats = """
- 점 5개의 상관은 통계적으로 거의 아무 의미가 없다. 여기서는 '단위를 키우면 상관이 부풀려진다'는 것을 보이려고 계산했다.
- 반대로 작은 단위에서 본 관계가 큰 단위에서 사라지거나 뒤집히기도 한다(→ 45번, 심슨의 역설).
"""
