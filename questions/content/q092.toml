concepts = ["map_classes", "choropleth"]
related = [32, 74]

background = """
#### 같은 자료, 다른 지도
Tract 2,184개의 1,000명당 민원을 5가지 색으로 칠한다고 하자. 구간을 어떻게 나누느냐에 따라 '빨간 동네'가 달라진다.

- **5분위(같은 개수)**: 칸마다 약 437개. 가장 진한 칸은 1,000명당 598건 이상인 437개 Tract다. 지도의 5분의 1이 늘 빨갛다.
- **같은 간격**: 값의 범위를 다섯 등분한다. 민원율은 위로 길게 치우쳐 있어서 1,108개가 가장 연한 칸, 930개가 둘째 칸에 몰리고,
  가장 진한 칸(1,591건 이상)에는 **6개**만 들어간다. 지도는 거의 하얗고 점 몇 개만 빨갛다.

5분위 지도는 "뉴욕 곳곳에 민원 많은 동네가 있다"를, 같은 간격 지도는 "몇 군데만 유난하다"를 말하는 것처럼 보인다. 둘 다 같은 숫자다.

#### 어떻게 해야 하나
- 범례에 구간 나누기 방식과 경계값을 적는다.
- 치우친 자료라면 로그 변환이나 분위수를 쓰되, '상위 20%'는 상대적 위치일 뿐이라고 밝힌다.
- 가능하면 두 방식을 나란히 보여 준다.
"""

method = """
1. Tract(인구 1,000명 이상)별 1,000명당 민원. 같은 간격의 범위가 극단값에 끌려가지 않도록 상위 0.5%는 범위 계산에서 뺐다.
2. 5분위 경계와 같은 간격 경계로 각각 5칸을 나눠 칸마다 Tract 수를 셌다.
"""

caveats = """
- 상위 0.5%를 빼지 않으면 같은 간격의 가장 진한 칸에는 한두 개만 남는다(63번 주소가 있는 Tract는 1,000명당 1만 건이 넘는다).
"""

