수탉 민원 382건은 **'불법으로 기르는 동물'** 유형이다. 뉴욕시에서는 암탉은 기를 수 있지만 **수탉은 기를 수 없다**(소음 때문이다).
브루클린 107건, 퀸스 94건, 브롱크스 92건, 스태튼아일랜드 74건, 맨해튼 15건이다.
'불법으로 기르는 동물'에는 그 밖에 가축(79건), 뱀(18건), 페럿(15건), 원숭이(5건)도 있다.

