concepts = ["simpson", "quintile", "outlier", "change_two_points"]
related = [44, 46]

background = """
#### 쓰고 싶은 문장
"부자일수록 민원이 적다. 뉴욕의 법칙이다."

#### 브루클린에서는 반대
자치구마다 소득 5분위를 **따로** 나눠 민원율을 그렸다.
- 브롱크스: 569 → 605 → 590 → 509 → 420건으로, 가운데부터 부유할수록 줄어든다.
- 스태튼아일랜드·맨해튼: 대체로 줄어든다(맨해튼은 Q2가 튄다).
- 퀸스: 오르내림이 있지만 큰 방향은 없다.
- **브루클린: 374 → 530건으로 부유할수록 늘어난다.**

브롱크스 최하위 칸은 원래 721건이다. 그중 1,000명당 152건이 11번의 이상치 주소 하나(655 E 230th St)에서 왔다.
이 한 칸 때문에 브롱크스가 '가장 가파르게 줄어드는' 자치구처럼 보였다. 차트는 이 주소를 뺀 값이다.

전체 평균(−0.13)은 지역마다 다른 관계를 덮어 버린다. 이것이 **심슨의 역설**이다.

#### 브루클린의 부유한 동네(가설)
브루클린의 고소득 Tract에는 윌리엄스버그·부시윅·그린포인트·파크슬로프처럼 지난 20년 사이 고소득 주민이 새로 들어온 동네가 많다.
새로 온 주민이 소음·주차·거리 문제를 더 많이 신고한다는 연구가 있다(→ 46번).
다만 이번 자료는 한 시점뿐이라 '새로 들어왔다'는 변화는 확인하지 못했다.
"""

method = """
1. 자치구마다 그 안의 Tract를 소득으로 5분위로 나눴다(시 전체 5분위가 아니다).
2. 분위별 민원 합 ÷ 분위 인구 × 1,000.
"""

caveats = """
- 자치구 안 5분위는 자치구마다 소득 구간이 다르다. 브롱크스 Q5와 맨해튼 Q5는 소득 수준이 전혀 다르다.
- 칸 하나에 Tract가 수십 개뿐이라 주소 하나가 칸 전체를 흔들 수 있다. 분위별 값을 볼 때는 상위 주소를 먼저 확인한다.
"""
