join_status = "방법만 정리함. NOAA 센트럴파크 일별 최저기온을 아직 받지 않았다."

background = """
#### 질문
BuildingHealthX는 기온이 0°C 아래로 내려가면 난방 민원이 2배가 된다고 정리했다. 우리 자료로 재현할 수 있을까?

#### 가장 쉬운 결합
NOAA의 일별 기온은 **날짜** 하나로 311에 바로 붙는다. 경계를 겹치거나 주소를 맞출 필요가 없다.
뉴욕은 센트럴파크 관측소 자료가 기준으로 많이 쓰인다.

#### 지금 보이는 것
2025년 11월 ~ 2026년 3월 겨울의 하루 난방 민원 중앙값은 1,511건이다. 가장 많은 날은 2월 8일(6,118건)이고,
1월 24–25일에 5,600건 안팎, 1월 29일 ~ 2월 1일에 4,200–5,200건이 이어진다. 1월 말의 한파 기간(→ 4번)과 겹친다.
7일 이동평균을 함께 그리면 요일 효과가 지워지고 한파의 길이가 보인다.

#### 붙이고 나면
- 일별 최저기온 구간(예: 5°C 이상, 0–5°C, 0°C 아래, −5°C 아래)별 하루 평균 난방 민원을 비교한다.
- 한파 첫날과 사흘째의 차이도 본다. 보일러는 추위가 이어질수록 더 자주 고장 난다.
"""

method = """
**지금 한 것**: 2025-11-01 ~ 2026-03-31 난방 민원의 하루 건수와 7일 이동평균(가운데 정렬).

**결합 방법(다음 단계)**
1. NOAA Climate Data Online에서 GHCN-Daily USW00094728(센트럴파크)의 TMIN, TMAX를 받는다(°F → °C 변환).
2. 날짜로 붙인다. NOAA의 하루는 현지 자정 기준으로 본다.
3. 최저기온 구간별 하루 평균 난방 민원, 기온과 민원의 산점도를 그린다.
"""

caveats = """
- 시 전체 기온 하나로 다섯 자치구를 대표한다. 동네마다 체감 기온이 다르다.
- 민원은 기온뿐 아니라 요일(주말에 관리인이 없다), 연휴의 영향도 받는다.
"""

