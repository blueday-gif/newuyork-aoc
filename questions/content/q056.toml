#### 결과
난방 민원은 1월 79,928건, 8월 3,682건으로 **22배** 차이 난다. 311에서 계절 폭이 가장 큰 유형 중 하나다.

#### 계절의 모양
- 10월 1일 난방 시즌이 시작되고 기온이 내려가면서 10월 중순부터 오른다(→ 13번).
- 12–2월에 정점을 이룬다. 1월이 가장 많다.
- 3월부터 빠르게 줄고, 5월 31일 시즌이 끝나면 여름에는 월 4천 건 안팎이 남는다. 여름 민원에는 온수 문제가 섞여 있는 것으로 보인다.

#### 겨울 안의 출렁임
하루 단위로 보면 겨울 안에서도 크게 출렁인다. 2월 8일에 6,118건으로 가장 많았고, 1월 24–25일, 1월 30일도 5천 건이 넘는다.
이런 날은 한파가 들이닥친 날로 보인다. 기온 자료를 붙이면 확인할 수 있다(→ 57번).
