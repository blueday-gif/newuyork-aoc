concepts = ["seasonality", "same_period"]
related = [14, 56, 55]

background = """
#### 쓰고 싶은 문장
"맘다니 취임(2026-01-01) 뒤 민원이 5% 늘었다."
12월 332,103건 → 1월 348,511건으로 숫자는 맞다.

#### 무엇이 늘었나
12월에서 1월로 늘어난 16,408건 중 **난방 민원 증가분이 16,026건(98%)**이다.
1월은 1년 중 난방 민원이 가장 많은 달이고, 1월 말에는 한파도 있었다.
늘어난 것은 거의 전부 계절 때문이다.

#### 취임 효과를 보려면
- 작년 12월 → 1월 변화와 비교한다. 매년 1월에 5%쯤 늘었다면 올해 증가는 평소 수준이다.
- 시장이 직접 바꾼 업무(예: 특정 기관의 처리 방식)가 있다면 그 유형만 따로 본다.
- 취임처럼 날짜가 정해진 사건은 '날짜 전후'보다 '같은 달 작년 대비'가 기본이다.
"""

method = """
1. 월별 전체 민원: 접수 월로 셌다.
2. 12월 → 1월 변화: 유형별 (1월 건수 − 12월 건수), 절댓값이 큰 8개.
"""

caveats = """
- 12월과 1월은 둘 다 31일이라 일수 차이는 없다. 2월처럼 짧은 달과 비교할 때는 하루 평균으로 바꾼다.
"""
