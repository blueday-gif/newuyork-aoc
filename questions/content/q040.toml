concepts = ["quintile", "outlier", "reported_vs_occurred"]
related = [11, 33, 61]

background = """
#### 결과
1,000명당 소음 민원은 소득 최하위 144.0건, 최상위 69.7건으로 약 2.1배다.

#### 하지만 한 주소가 들어 있다
11번의 이상치 주소(655 E 230th St, 4.7만 건)가 소득 최하위 분위 Tract에 있다. 이 주소가 최하위 분위를 1,000명당 24건 끌어올린다.
빼면 최하위 119.9건, 격차는 **약 1.7배**다. 여전히 가난한 동네가 많지만 '2배'는 과장이다.

#### 어떤 소음인가
세부 유형으로 나누면 격차의 대부분은 **주거 소음**(이웃, 91.6 → 21.6건)과 **길거리 소음**(36.5 → 13.0건)에서 나온다.
반대로 **공사 소음**(DEP 담당)과 **상업 시설 소음**은 부유한 동네가 더 많다. 공사가 많고 식당·술집이 몰린 곳이다.

#### 왜 가난한 동네에 이웃 소음이 많나(가설)
밀도 높은 공동주택, 얇은 벽, 좁은 집이 겹친다. 소음을 피할 곳(큰 집, 별장)이 없다.
동시에, 가난한 동네에서는 이웃 사이 갈등을 경찰(311 소음은 NYPD가 처리)에 맡기는 경향이 있다는 지적도 있다.
"""

method = """
1. 소음 분야 민원을 Tract에 붙여 소득 5분위별 1,000명당.
2. 세부 유형(주거, 길거리, 차량, 상업 시설, 공사·기타)별로 같은 계산.
3. 11번의 이상치 주소를 뺀 값도 함께 구했다.
"""

caveats = """
- 소음 신고는 경찰이 처리한다. 경찰 접촉을 꺼리는 동네는 소음이 있어도 덜 신고할 수 있다.
"""
