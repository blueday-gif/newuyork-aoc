background = """
#### 기관별 미종결 비율(1년 1,000건 이상 기관)
- **경제개발공사(EDC) 100%**: EDC가 받은 민원 10,971건은 **전부 헬리콥터 소음**이다(→ 62번). EDC는 시 헬리포트를 관리하는 기관이라 헬리콥터 소음 민원이 이리로 간다. 그런데 하나도 닫히지 않는다. '기록만 하는' 민원이다.
- **택시리무진위원회(TLC) 57.1%**: 택시 민원의 78%가 미종결이다. 택시 민원은 기사 청문 절차로 넘어가 오래 걸리고, 분실물 신고는 주인을 찾을 때까지 열려 있다.
- **공원국(DPR) 32.9%**: 나무(가지 정리, 죽은 나무, 뿌리로 들뜬 보도) 민원이 작업 일정에 따라 몇 달씩 열려 있다.

시 전체 미종결은 4.0%다.

#### 미종결의 여러 뜻
'닫히지 않는다'는 것은
- 일이 밀렸다(나무, 가로등)
- 절차가 길다(택시 청문)
- 닫을 이유가 없다(헬리콥터 소음처럼 기관이 단속 권한이 없거나 기록만 하는 경우)
중 무엇일 수도 있다. 기관의 미종결 비율을 성과 지표로 쓰려면 이 차이를 먼저 가려야 한다.
"""

