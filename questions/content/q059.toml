concepts = ["seasonality", "per_capita"]
related = [60, 16, 69]

background = """
#### 질문
민원이 많은 동네는 계속 많을까, 아니면 그때그때 바뀔까?

#### 반년 vs 반년
12개월을 앞 6개월(11–4월, 겨울)과 뒤 6개월(5–10월, 여름)로 나눠 Tract마다 1,000명당 민원을 따로 구했다.
- 앞 6개월에 상위 10%였던 Tract의 **66%**가 뒤 6개월에도 상위 10%다. 순위가 완전히 무작위라면 10%였을 것이다.
- 앞뒤 순위 상관은 **0.86**이다.

#### 계절이 바뀌어도
겨울에는 난방, 여름에는 소음·불꽃놀이로 민원의 내용이 크게 바뀐다. 그런데도 동네의 순위는 거의 그대로다.
민원은 한때의 사건보다 **그 동네의 성격**(밀도, 주택, 세입자, 신고 성향)에 가깝다.
"""

method = """
1. 민원을 Tract에 붙여 2026-05-01 이전(앞)과 이후(뒤)로 나눴다.
2. Tract별 1,000명당 민원(앞, 뒤).
3. 앞 상위 10% 중 뒤에도 상위 10%인 비율, 앞뒤 Spearman 상관.
"""

caveats = """
- 같은 동네의 반년은 같은 건물·같은 주소를 공유한다. 11번 같은 반복 신고 주소가 있는 Tract는 앞뒤가 자연스럽게 닮는다.
"""
