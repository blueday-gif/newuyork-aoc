background = """
#### 기사의 요지
지역 방송 보도는 "누수 민원은 줄었는데 주민은 아직 수리를 기다린다"고 전했다.
민원 수가 문제의 양을 그대로 보여 주지 않는다는 이야기다.

#### 민원 감소 ≠ 문제 감소
신고해도 고쳐지지 않는다고 느끼면 사람들은 신고를 멈춘다(**신고 피로**).
그러면 민원 수는 줄어도 새는 천장은 그대로다. 311 건수를 기관 성과 지표로 쓸 때 가장 흔한 착각이다.

#### 누수 민원은 어떻게 닫히나
이번 12개월 HPD 누수 민원 49,228건의 결과문을 묶어 보면,
**약 38%는 점검원이 집에 들어가지 못해 닫혔고**, 위반이 발부된 것도 약 38%다.
'닫힘' 열 건 중 네 건 가까이가 현장 확인 없이 끝난 셈이다.
세입자가 집에 없거나, 연락이 닿지 않거나, 점검 시간을 맞추지 못하면 이렇게 된다.

#### 12개월로는 추세를 못 본다
우리 자료는 1년치라서 "줄었다"를 확인할 수 없다. 월별로는 2월과 8월에 높다.
늘고 줄어든 것이 계절(눈 녹음, 여름 폭우)인지 신고 의지인지 가르려면 여러 해 자료와 강수량을 함께 봐야 한다.
"""

method = """
1. `Problem = "WATER LEAK"`(HPD)만 셌다. DEP의 상수도 민원(Water System 등)은 길·수도관 문제라 뺐다.
2. 결과문을 4번과 같은 HPD 규칙으로 분류했다.
"""

caveats = """
- 점검을 못 해 닫힌 민원은 다시 신고될 수 있다. 같은 집의 재신고를 묶어 세면 '해결되지 않은 집' 수를 더 잘 볼 수 있다.
- 영상은 제목과 설명만 확인했다. 기사 속 수치는 검증하지 않았다.
"""

