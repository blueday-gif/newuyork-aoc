concepts = ["quintile", "reported_vs_occurred"]
related = [16, 20, 24]

background = """
#### 분야별로 나누면
Tract 임차율과 분야별 1,000명당 민원의 순위 상관은 다음과 같다.
- 주거환경 0.60
- 소음 0.55
- 위생 0.36
- 도로·교통 −0.28
- 해충·동물 0.00

#### 세입자 동네의 민원
세입자 동네는 **'집 안'**(난방, 누수, 곰팡이)과 **'이웃'**(주거 소음) 문제로 신고한다.
집 안 문제는 고칠 책임이 집주인에게 있어 세입자가 시에 기댈 수밖에 없고, 공동주택은 이웃 소음이 잦다.

#### 도로·교통은 반대 방향
도로·교통은 음수다. 다만 단순히 "자가 동네일수록 많다"는 아니다. 1,000명당 불법주차 민원은
임차율 분위 Q1부터 64 → 83 → 88 → 70 → 55건으로 **가운데(Q2–Q3)에서 가장 많고** 세입자가 가장 많은 동네에서 가장 적다.
진입로 막힘도 같은 모양이다(22 → 29 → 28 → 24 → 14건). 차와 진입로는 많은데 길가 주차 공간이 빠듯한 동네에서 다툼이 생기는 것으로 보인다.
같은 '민원 많은 동네'라도 내용이 전혀 다르다.

#### 해충은 왜 0인가
쥐·해충 민원은 임차율과 관계가 없다. 거리 조건(식당, 쓰레기, 공원)을 따라가는 것으로 보인다.
"""

method = """
1. 민원 유형을 7개 분야로 묶은 대응표(data/processed/category_map.csv)를 썼다.
2. Tract별 분야 민원 ÷ 인구 × 1,000과 임차율의 Spearman 상관.
3. 임차율 5분위별 분야 민원율. 차트는 분야마다 최하위 분위를 100으로 맞췄다.
"""

caveats = """
- 분야 묶음은 연구자의 선택이다. 어떤 유형을 어디에 넣었는지에 따라 결과가 달라진다.
- 상관은 원인이 아니다. 임차율이 높은 동네는 밀도도 높아 소음이 많을 수 있다.
"""
