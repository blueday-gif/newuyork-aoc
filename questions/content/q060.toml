concepts = ["regression_to_mean", "did"]
related = [59, 14, 19]

background = """
#### 쓰고 싶은 문장
"앞 6개월 민원 상위 10% 동네는 전체 중앙값의 2.33배였는데, 뒤 6개월에는 2.13배로 내려왔다. 개선됐다."

#### 무엇이 틀렸나
**평균으로의 회귀**다. 처음에 극단으로 뽑힌 집단은 다시 재면 조금 덜 극단적으로 나온다.
아무 정책이 없어도 생긴다. 상위 10%로 뽑힌 동네에는 '원래 민원이 많은 곳'과 '그때 우연히 많았던 곳'이 섞여 있고,
다음 측정에서 우연은 평균으로 돌아오기 때문이다.

#### 양쪽 끝이 모두 가운데로
앞 6개월 순위로 Tract를 10개 집단으로 나눠 앞·뒤 민원율(중앙값 대비)을 그렸다.
- 맨 위 집단은 2.33배 → 2.13배로 **내려온다**.
- 맨 아래 집단은 0.44배 → 0.47배로 **올라온다**.
위는 크게 내려오고 아래는 조금 올라온다. 양 끝이 모두 가운데 쪽으로 움직인다는 점이 회귀의 표시다.
위쪽 변화가 더 큰 것은 상위 동네의 민원율 분포가 위로 길게 늘어져 있어(우연이 끼어들 여지가 크다) 생기는 흔한 모양이다.
진짜 '개선'이라면 아래쪽은 그대로 있고 위만 내려와야 한다.

#### 왜 중요한가
"민원 상위 동네에 집중 단속 → 이듬해 감소 → 효과 있음"이라는 보도자료는 흔하다.
효과를 말하려면 단속하지 않은 비슷한 상위 동네(대조군)도 같은 만큼 내려왔는지 봐야 한다(→ 개념 '이중차분').
"""

method = """
1. 59번과 같은 앞·뒤 6개월 Tract 민원율.
2. 앞 6개월 민원율 순위로 10분위(D1 최저 ~ D10 최고).
3. 분위마다 앞·뒤 민원율의 중앙값을 각 기간 전체 중앙값으로 나눴다.
"""

caveats = """
- 앞은 겨울, 뒤는 여름이다. 계절에 따라 순위가 바뀌는 동네(난방 민원이 많은 동네 등)가 회귀처럼 보이는 몫을 더할 수 있다.
"""
