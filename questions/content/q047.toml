concepts = ["majority_group", "ecological_fallacy", "outlier"]
related = [34, 35, 33]

background = """
#### 결과
Tract의 집단 비율과 분야별 1,000명당 민원의 순위 상관이다.
- **주거환경**: 흑인 비율 0.40, 히스패닉 비율 0.32
- **소음**: 히스패닉 비율 0.37, 흑인 비율 0.26
- 백인 비율은 주거·소음 모두 음수, 아시아계 비율도 대체로 음수다.

같은 "소수인종 동네"도 민원의 결이 다르다. 흑인 비율이 높은 동네는 **집 안** 문제가, 히스패닉 비율이 높은 동네는 **이웃 소음**이 상대적으로 더 강하게 엮인다.

#### 해석(가설)
흑인 다수 동네에는 브루클린 중부·동부와 브롱크스 북동부의 오래된 임대 건물이 많다.
히스패닉 다수 동네는 브롱크스 남·서부, 맨해튼 북부의 밀도 높은 대형 아파트가 많아 이웃 소음이 잦을 수 있다.
"""

method = """
1. Tract(인구 1,000명 이상)별 히스패닉·흑인·백인·아시아계 비율과 분야별 1,000명당 민원의 Spearman 상관.
"""

caveats = """
- 원문은 히스패닉 × 소음을 0.38로 적었다. 원문은 다른 Tract 표(plan02)의 소음률로 계산했고, 이 페이지는 분야 대응표로 다시 셌다. 반올림 수준의 차이다.
- 순위 상관이라 한 Tract의 이상치(11번 주소)의 영향은 작다.
"""
