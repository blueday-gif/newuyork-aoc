concepts = ["confounding", "stratification", "ecological_fallacy"]
related = [16, 17, 35]

background = """
#### 상관 0.34
Tract 임차율과 1,000명당 민원의 순위 상관은 0.34다(→ 16번). "세입자가 민원을 만든다"는 뜻일까?

#### 공통 원인 후보
임차율과 함께 움직이는 변수를 보면
- **인구 밀도**: 임차율과 0.59. 세입자 동네는 빽빽하다.
- **빈곤율**: 임차율과 0.58.
- **중위 가구소득**: 임차율과 −0.52.
- **1950년 이전 주택 비율**: 임차율과 거의 무관(−0.01).

그런데 이 변수들과 **민원율**의 상관은 모두 약하다(밀도 0.07, 빈곤율 0.17, 노후 0.19, 소득 −0.13).
'공통 원인'이 되려면 두 쪽 모두와 강하게 엮여야 하는데, 민원 쪽 연결이 약하다.

#### 밀도를 맞춰 보면
인구 밀도 5분위 **안에서** 임차율과 민원율의 상관을 다시 구하면 0.25–0.46이다. 밀도가 비슷한 동네끼리만 봐도 관계가 남는다.
그러니 '밀도 때문'만은 아니다. 그래도 이것이 인과라는 뜻은 아니다. 노후 건물의 관리 상태, 관리 주체(대형 임대 회사), 세입자의 법적 권리 같은 측정하지 않은 원인이 남아 있다.

#### 말할 수 있는 것
"임차율이 높은 동네에 민원이 많고, 이 관계는 밀도를 맞춰도 남는다." 원인은 아직 모른다.
"""

method = """
1. Tract(인구 1,000명 이상)별 임차율, 1,000명당 민원, 인구 밀도(인구 ÷ Tract 면적), 빈곤율, 노후 주택 비율, 소득의 Spearman 상관.
2. 인구 밀도 5분위마다 임차율과 민원율의 상관을 다시 구했다(층화).
"""

caveats = """
- 층화는 한 번에 한 변수만 맞춘다. 여러 변수를 함께 맞추려면 회귀 모형이 필요하다(plan02 보고서 참고).
"""
