concepts = ["outlier", "same_period", "reported_vs_occurred"]
related = [61, 69, 70, 85]

background = """
#### 소음은 311의 1위 분야
뉴욕 311에서 소음은 해마다 가장 많은 분야다. 주거 소음(이웃), 길거리 소음, 차량, 상업 시설,
공사 소음으로 나뉜다. 주거·길거리 소음은 **경찰(NYPD)**이, 공사·상업 시설 소음은 **환경보호국(DEP)**이 주로 맡는다.

#### 2024년 기사
2024년 보도는 소음 민원이 73.8만 건으로 1위라고 했다. 이번 12개월(2025-11 ~ 2026-10)은 78.8만 건이다.
숫자만 놓고 보면 6–7% 늘었다.

#### 한 주소가 만든 증가
브롱크스의 한 주소(655 E 230th St)에서 1년 동안 약 4.7만 건의 소음 민원이 들어왔다.
전체 소음의 6%다. 그런데 고르게 들어온 것이 아니다. **2025년 11–12월 두 달에 약 4.25만 건(90%)**이 몰렸고,
12월에는 하루 900건꼴이었다. 6월 이후로는 거의 0이다. 이런 패턴은 대개 **극소수의 반복 신고자**에게서 나온다.
이 주소 하나를 빼면 74만 건으로 2024년과 거의 같다.
"""

method = """
1. `Problem`이 "Noise"로 시작하는 유형을 모두 소음으로 묶었다.
2. 주소는 대문자·공백 정리를 한 뒤 센다(`655 EAST 230 STREET`).
3. 월별로 '이 주소'와 '나머지'를 나눠 쌓았다.
4. 증감률 = 이번 12개월 ÷ 73.8만 − 1. 이 주소를 뺀 값도 같은 식으로 구했다.
"""

caveats = """
- 기간이 다르다. 2024년은 달력 1–12월, 이번은 11월부터 다음 해 10월까지다. 같은 기간을 받아 다시 비교해야 '증가'를 말할 수 있다.
- 이상치를 빼는 것이 늘 옳지는 않다. "311 소음 업무량"을 묻는다면 4.7만 건도 실제 업무다.
- 반복 신고자 문제는 다른 주소에도 있다. 상위 주소 표에서 2위, 3위도 확인하자.
"""

