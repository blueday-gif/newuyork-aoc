concepts = ["choropleth", "ecological_fallacy", "per_capita"]
related = [17, 18, 25]

background = """
#### 쓰고 싶은 문장
선거 지도와 민원 지도를 나란히 놓고 "닮았다"고 하기.

#### 지도는 땅을 보여 준다
Tract마다 색을 칠한 지도(단계구분도)에서 눈에 띄는 정도는 **면적**에 비례한다. 사람 수가 아니다.
- 뉴욕에서 가장 넓은 Tract 10%(224개)가 지도 면적의 46%를 차지하지만, 인구는 11%다.
- 스태튼아일랜드는 지도의 22%를 차지하지만 인구는 6%다.
- 맨해튼은 인구가 19%인데 지도에서는 7%로 작게 보인다. 퀸스는 반대로 인구 27%, 지도 38%다.

두 지도가 '닮아 보이는' 것은 대개 넓은 몇 곳(스태튼아일랜드, 퀸스 동부)이 둘 다 같은 색이라서다.

#### 어떻게 다시 그리나
- **카토그램**: 지역 크기를 인구에 비례하게 바꾼다.
- **점 밀도 지도**: 1,000명당 점 하나처럼 사람 수만큼 점을 찍는다.
- **육각 격자**: 같은 크기 칸으로 나눠 색을 칠한다.
- 그리고 '닮았다'는 눈이 아니라 **Tract 단위 상관**으로 잰다(인구 가중 상관이면 더 좋다).
"""

method = """
1. ACS Tract 경계(GeoJSON)를 뉴욕주 평면좌표계(EPSG:2263)로 바꿔 면적을 구했다.
2. 자치구별 면적 몫과 인구 몫을 비교했다.
3. 인구가 있는 Tract를 면적 순으로 줄 세워 상위 10%의 면적 몫과 인구 몫을 구했다.
"""

caveats = """
- 면적은 Tract 경계 기준이다. 경계에 물(강·만)이 포함된 Tract가 있어 실제 땅 면적과 조금 다르다.
"""
