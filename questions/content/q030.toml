concepts = ["quintile", "per_capita", "compare_like"]
related = [23, 29, 27]

background = """
#### 불법주차
불법주차는 단일 유형으로 1위다(618,157건). 경찰(NYPD)이 처리하며, 소화전 막음·표지판 위반·보도 막음이 대부분이다.

#### 어느 동네에서
소득 5분위로 보면 도로·교통 민원은 **가운데가 가장 높은 역U자**다.
최하위 분위 94.5건(1,000명당), 중간(Q3) 164건, 최상위 141건이다.
- 저소득 동네는 차를 가진 가구가 적다. 주차 다툼도 적다.
- 중간 소득의 퀸스·브루클린 주택가는 차와 진입로가 많은데 길가 주차 공간이 빠듯하다. 가장 많이 부딪친다.
- 고소득 동네는 차고·건물 주차장이 많아 다시 줄어든다.

#### 자치구로 보면
1,000명당 불법주차는 브루클린·퀸스가 높다. 맨해튼은 차가 적고 유료 주차가 많아 상대적으로 낮다.
"""

method = """
1. 민원을 Tract에 붙여 소득 5분위별 도로·교통 분야 민원 ÷ 분위 인구 × 1,000.
2. 자치구별 `Illegal Parking` ÷ 자치구 인구 × 1,000.
"""

caveats = """
- 분모가 거주 인구다. 차 대수나 길가 주차 공간을 분모로 쓰면 그림이 달라질 수 있다.
- 역U자의 이유(차량 보유, 주차 공간)는 가설이다. ACS의 '가구당 차량 수'를 붙이면 확인할 수 있다.
"""
