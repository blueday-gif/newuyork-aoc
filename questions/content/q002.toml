concepts = ["per_capita", "reported_vs_occurred"]
related = [1, 3, 55]

background = """
#### 하루가 아니라 1주일로
1번은 폭설 다음 날 하루만 봤다. 하루짜리 비교는 "그날 어디부터 치웠나"에 크게 흔들린다.
눈이 내리기 시작한 2월 22일 저녁부터 3월 2일까지 1주일을 합치면 우연이 줄고 구조가 남는다.

#### 몫과 몫을 비교하기
가장 쉬운 점검은 **"민원 몫"과 "인구 몫"을 나란히 놓는 것**이다.
다섯 자치구가 인구만큼 신고했다면 두 막대 높이가 같아야 한다.
스태튼아일랜드는 인구로는 6%인데 눈 민원은 40%를 냈다.

#### 왜 이렇게 벌어지나(가설)
- **집 구조**: 단독주택과 차고 앞 진입로가 많아서 "우리 집 앞 길"이 막히면 바로 생활이 멈춘다.
- **교통수단**: 지하철이 없고 자가용 의존도가 높다.
- **제설 순서**: 간선도로부터 치우므로 좁은 주택가 골목은 늦게 치워진다.
- **신고 습관**: 평소에도 311을 많이 쓰는 동네일 수 있다(→ 4부).
311만으로는 이 가설들을 가를 수 없다. 도로 길이, 주택 유형, 평소 신고율을 붙여 봐야 한다.
"""

method = """
1. `Problem = "Snow or Ice"`, 접수 시각이 2026-02-22 18:00 이상 2026-03-03 00:00 미만인 행.
2. 자치구가 'Unspecified'인 1건은 뺐다(원문 23,096건 → 23,095건).
3. 민원 몫 = 자치구 건수 ÷ 5개 자치구 합. 인구 몫 = 자치구 인구 ÷ 시 인구(ACS 2024 5개년).
4. 10만 명당 = 건수 ÷ 인구 × 100,000.
"""

caveats = """
- 인구는 밤에 사는 곳 기준이다. 맨해튼은 낮 인구(통근자)가 훨씬 많지만 눈 민원 분모로는 큰 의미가 없다.
- "1주일"의 끝을 어디로 잡느냐에 따라 몫이 조금 달라진다. 뒤로 갈수록 치우지 못한 곳의 재신고가 섞인다.
"""

