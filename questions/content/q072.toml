background = """
#### 건물 증후군
ikrar.dev의 분석은 여섯 가지 주거 민원이 **함께** 나오는 건물이, 신고가 시작되기 전부터 위반율이 12–44배 높았다고 했다.
여러 문제가 한꺼번에 나오는 건물은 관리가 무너진 건물이라는 신호라는 뜻이다.

#### 311로 따라 해 보기
HPD 민원이 있는 건물 60,095동에서, 건물마다 12가지 주거 유형(난방, 배관, 페인트·회벽, 누수, 바닥·계단, 가전 등) 중 몇 가지가 나왔는지 셌다.
- 한 가지 유형만 나온 건물이 39%로 가장 많다.
- **6가지 이상** 나온 건물은 12,981동(21.6%)이다. '건물 증후군' 후보다.

#### 함께 나오는 짝
두 유형이 함께 나오는 정도를 향상도로 쟀다. 바닥·계단, 가전, 안전, 일반, 문·창문이 서로 우연의 **2.3–2.6배**로 함께 나온다.
이 유형들은 한 번 점검에서 여러 개가 함께 지적되는 '관리 전반'의 문제들이다.
다만 상위 짝들의 향상도가 비슷한 것은, 문제가 많은 큰 건물에서 거의 모든 유형이 함께 나오기 때문이기도 하다(→ 개념 '향상도').
"""

method = """
1. HPD 민원(BBL 있음)으로 건물 × 유형 표(나왔다/안 나왔다)를 만들었다.
2. 건물마다 나온 유형 수의 분포.
3. 3% 이상 건물에서 나온 유형끼리 짝을 지어 향상도 = P(둘 다) ÷ (P(A) × P(B)). 500동 이상에서 함께 나온 짝만 보였다.

**결합 방법(다음 단계)**: HPD 위반 자료를 BBL로 붙여, 6가지 이상 건물과 나머지 건물의 '첫 신고 이전 1년' 위반율을 비교한다.
"""

