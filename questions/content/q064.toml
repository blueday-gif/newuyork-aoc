concepts = ["sensitivity", "outlier", "per_capita"]
related = [63, 11, 40]

background = """
#### 민감도 분석
자치구별 1,000명당 소음 민원은 브롱크스 155.8건, 맨해튼 109.9건, 브루클린 80.5건, 퀸스 68.5건, 스태튼아일랜드 38.0건이다.
63번의 한 주소(4.7만 건)가 브롱크스에 있으니, 그것을 빼고 다시 계산했다.

- 브롱크스는 155.8건 → **122.3건**으로 내려간다. 그래도 **1위**다.
- 다른 자치구는 그대로다.
- 그런데 1위와 2위(맨해튼)의 격차는 **1.42배 → 1.11배**로 크게 줄어든다.

#### 무엇이 유지되고 무엇이 바뀌었나
"브롱크스가 소음 민원이 가장 많은 자치구"라는 **순위**는 유지된다. 하지만 "맨해튼보다 40% 넘게 많다"는 **크기**는 유지되지 않는다.
이상치를 뺀 결과와 뺀 뒤의 결과를 나란히 보여 주고, 둘 중 무엇이 바뀌었는지 쓰는 것이 민감도 분석이다.
"""

method = """
1. 소음 민원을 자치구별로 세어 자치구 인구(ACS 2024 5개년)로 나눴다.
2. 같은 계산을 655 E 230th St를 빼고 다시 했다.
"""

caveats = """
