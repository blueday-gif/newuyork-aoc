background = """
#### 임대료 동결을 추적하는 결합
RGB 안정화 건물 목록을 BBL로 311에 붙이면, 동결을 받는 건물과 받지 않는 건물의 민원을 나눠 볼 수 있다.
2026년 10월부터 동결이 시작됐으니, 한 시즌이 쌓이는 **2027년 봄**부터 이중차분(→ 15번)으로 동결이 건물 관리에 미친 영향을 추적할 수 있다.

#### 준비는 되어 있다
- HPD 주거 민원 907,790건 중 **99.7%**에 BBL이 있다.
- HPD 민원이 들어온 건물은 60,117동이다.
- 동결 전 기준선(2025-11 ~ 2026-09)이 이미 있다. 이것을 안정화·비안정화 두 줄로 나누는 것이 첫 단계다.

#### 함께 봐야 할 것
동결 효과를 보려면 민원만으로는 부족하다. 공실(→ 21번), 수리 허가(DOB), 위반 기록(→ 97번)을 함께 보면
'관리를 놓았나', '공실로 묶었나', '그대로인가'를 가를 수 있다.
"""

method = """
**지금 한 것**: HPD 민원의 BBL 비율, 건물 수, 월별 건수.

**결합 방법(다음 단계)**: 15번과 같다. RGB 목록 → BBL 정규화 → 311 HPD 민원에 '안정화' 표시 → 세대 수(PLUTO)로 나눈 월별 민원 → 평행 추세 확인 → 2027년 봄 이중차분.
"""

caveats = """
- RGB 목록은 '안정화 아파트가 한 채라도 있는 건물'이다. 건물 안의 안정화 비율은 알 수 없다.
"""

