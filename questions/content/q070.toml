background = """
#### 난방 민원 1위 건물
브롱크스의 한 건물(BBL 2046990051, 1040B East 217th Street)에 1년 동안 **2,228건**의 난방 민원이 들어왔다.
- 민원이 들어온 날은 138일, 하루 최다 65건이다. 겨울 내내 거의 매일 들어왔다.
- 그 민원의 **60%**는 '이미 접수된 건물 전체 문제의 중복'으로 닫혔다(→ 4번).
- 결과문에 '위반 발부'가 적힌 것은 0.1%다. 대부분 중복, '점검(결과는 HPD 사이트)', '복구됐다고 확인'으로 닫혔다.

#### 어떻게 이런 숫자가 나오나
세대가 많은 큰 건물에서 보일러가 자주 멈추면, 멈출 때마다 여러 세대가 신고한다. 한 번 고장에 수십 건이 들어온다.
그래서 2,228건은 '2,228번 고장'이 아니라 '여러 세대가 여러 번 겪은 추위'의 합이다.

#### 위반은 정말 없었나
결과문만으로는 알 수 없다. HPD는 건물 전체 문제로 한 건만 점검하고 나머지를 중복으로 닫으므로,
위반은 그 한 건에 기록된다. 건물의 실제 위반 기록은 HPD 위반 자료에서 BBL로 확인해야 한다(→ 7, 71번).
"""

