concepts = ["acs_bins", "quintile", "confounding"]
related = [16, 23, 69]

background = """
#### 집주인 측 주장
동결에 반대한 집주인들은 "임대료를 못 올리면 낡은 건물을 관리할 수 없다"고 주장했다.
안정화 아파트는 대부분 1974년 이전에 지은 건물이라 노후 건물 관리 비용은 실제 쟁점이다.

#### 노후 주택과 주거 민원
1950년 이전에 지은 주택 비율로 Tract를 5분위로 나누면, 1,000명당 주거 민원은
59 → 85 → 105 → 107 → 102건이다. 처음에는 오르다가 가운데부터 **멈춘다**.
Tract 단위 순위 상관은 0.11로 약하다.

#### 왜 멈추나(가설)
- 노후 주택이 아주 많은 동네 중에는 소득이 높고 소형 건물·자가가 섞인 곳이 있다.
- '오래됨'보다 **관리 주체**(대형 임대 건물인가, 집주인이 직접 사는가)가 더 중요할 수 있다.
- ACS 건축연도는 '1939년 이전'이 한 칸이라 1900년 건물과 1935년 건물을 가를 수 없다.

#### 이 결과가 말하는 것
"노후 주택이 많을수록 주거 민원이 많다"는 어느 지점까지만 맞다. 집주인 주장을 검증하려면
건물 단위로 건축연도(PLUTO), 안정화 여부(RGB 목록), 민원을 함께 봐야 한다.
"""

method = """
1. ACS 2024 5개년의 '1950년 이전에 지은 주택 비율'(pre1950_share)로 Tract를 5분위로 나눴다(동점은 순위로 나눔).
2. 주거환경 분야 민원(난방, 누수 등 HPD 계열)의 분위별 1,000명당.
3. Tract별 Spearman 상관.
"""

caveats = """
- 원문(story_01)에는 60 → 86 → 105 → 108 → 103으로 적혀 있다. 같은 계산의 반올림 차이이고, 이 페이지 값(59.2, 85.2, 104.6, 107.4, 102.3)이 계산 결과 그대로다.
- 노후 비율은 임차율·소득과 얽혀 있다. 노후 '때문'이라고 하려면 이들을 통제해야 한다.
"""
