join_status = "Mapping Inequality의 HOLC 등급 지도(GeoJSON)를 아직 받지 않았다. 이 문항은 해설만 있다."

background = """
#### 레드라이닝
1930년대 연방 주택소유자대출공사(HOLC)는 도시마다 동네에 A(초록)–D(빨강) 등급을 매겼다. 등급은 인종 구성을 크게 반영했고,
D 등급 동네에는 대출이 사실상 막혔다. 뉴욕(브롱크스, 브루클린, 맨해튼, 퀸스, 스태튼아일랜드)도 모두 등급 지도가 있다.

#### 90년 뒤의 흔적
Northrop 등의 연구는 옛 D 등급 지역이 오늘날에도 녹지가 적고, 여름에 더 뜨겁고, 건물이 낡았다는 점을 보였다.
투자가 끊긴 동네의 건물은 관리가 늦어지고, 그 결과가 오늘의 **난방·정전 민원**으로 이어지는지 볼 수 있다.

#### 결합 방법
- **Mapping Inequality**(리치먼드 대학)에서 뉴욕 HOLC 등급 GeoJSON을 받는다.
- Tract와 겹쳐 면적 비율로 등급을 옮긴다(예: D 등급 면적 비율, 또는 면적 가중 평균 등급).
- 등급별 임차가구당 난방 민원, 정전(전력) 민원을 비교한다.
- 소득·임차율·건물 나이를 통제해도 등급의 차이가 남는지 본다.
"""

method = """
**결합 방법(다음 단계)**
1. Mapping Inequality에서 뉴욕 다섯 자치구의 HOLC 폴리곤을 받는다.
2. Tract 경계와 겹쳐 등급별 면적 비율을 계산한다. 1930년대에 등급이 매겨지지 않은 곳(공원, 산업 지역 등)은 '등급 없음'.
3. 주된 등급(면적 50% 이상)으로 Tract를 나누고, 등급별 임차가구 1,000가구당 난방 민원을 구한다.
4. 36번처럼 소득 분위 안에서 등급 차이를 다시 본다.
"""

caveats = """
- 등급이 매겨진 곳은 1930년대 주거지뿐이다. 이후 개발된 퀸스 동부·스태튼아일랜드 대부분은 빠진다.
- 등급과 오늘의 민원 사이에는 90년의 변화(재개발, 공공주택, 젠트리피케이션)가 있다. 인과를 말하기는 매우 어렵다.
"""

