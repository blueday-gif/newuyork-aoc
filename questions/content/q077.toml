#### 197가지 유형
이번 12개월에 311에는 197가지 유형의 민원이 들어왔다.
- **상위 10개** 유형(불법주차, 주거 소음, 난방 등)이 전체의 **57%**다.
- **45가지**는 1년에 100건도 안 된다.
- **딱 1건**뿐인 유형이 세 가지다: 비둘기 포획(Trapping Pigeon), 건물 집행관실(Building Marshals office), 안전(Safety).

#### 꼬리에는 무엇이 있나
가장 드문 유형 15개에는 기름·가스 유출(8건), 건조기 배출(7건), 터널 상태(6건), 공중전화 민원(5건), 스퀴지(5건)가 있다.
- **공중전화**: 뉴욕 거리의 공중전화는 와이파이 키오스크(LinkNYC)로 대부분 바뀌었고, 2022년 타임스스퀘어의 마지막 공공 공중전화가 철거됐다. 그래도 민원 칸은 남아 있다.
- **안전**(Safety, 1건): 같은 이름의 대문자 유형 'SAFETY'(HPD)와 별개로 남은 유형이다. 분류 목록에 이런 흔적이 많다.

#### 왜 중요한가
꼬리 유형은 하나하나는 작지만 모두 합치면 무시할 수 없고, 도시가 무엇을 '민원'으로 다루는지 보여 준다.
반대로 분석에서는 꼬리를 '기타'로 묶어야 표가 읽힌다. 무엇을 묶었는지 적어 둔다.
