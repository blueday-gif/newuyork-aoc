concepts = ["multiple_testing", "small_numbers"]
related = [59, 92]

background = """
#### 동네마다 검정하면
"민원이 유난히 많은 동네 군집(핫스팟)이 있나?"를 Tract 2,195개 각각에 대해 국지 공간 자기상관(LISA)으로 검정했다(plan02 분석).
유의수준 5%라면, 아무 군집이 없어도 2,195 × 5% ≈ **110개**가 우연히 '유의'하게 나온다.

#### 결과
- 보정 전 p < 0.05: **278개**. 우연 기대치의 2.5배라 무언가 있어 보인다.
- **FDR 보정 후: 0개.** 어느 Tract도 '특별한 군집'이라고 말할 근거가 남지 않는다.

#### 왜 둘이 다른가
278개는 '전체적으로 이웃끼리 비슷한 경향이 있다'는 신호일 수 있다. 실제로 전역 공간 자기상관(Moran's I)은 유의하다(plan02).
하지만 '이 Tract가 특별하다'고 하나하나 지목하려면, 2,195번 시도한 만큼 기준을 엄격하게 해야 한다.
그 기준을 넘는 Tract는 없다. **"전체적으로 뭉쳐 있다"와 "여기가 핫스팟이다"는 다른 주장**이다.

#### p값 분포 읽기
진짜 효과가 많으면 p값이 0 근처에 크게 몰린다. 여기서는 왼쪽 칸이 조금 높을 뿐 오른쪽으로 완만하게 줄어든다.
"""

method = """
1. plan02 분석의 LISA 결과표(outputs/tables/plan02_lisa.csv)를 읽었다. 순열 검정 p값(lisa_p)과 Benjamini–Hochberg FDR 보정값(lisa_p_fdr).
2. p < 0.05, FDR q < 0.05인 Tract 수와 p값 분포.
"""

caveats = """
- 순열 검정의 p값은 순열 횟수에 따라 조금 흔들린다.
- Getis-Ord Gi*로 보면 FDR 5%에서 핫스팟 32개가 나온다(plan02). 방법마다 기준이 달라 결과가 다를 수 있다.
"""
