# 결합 문항: 아직 HPD 위반 자료를 붙이지 않았다. 우리 데이터로 보이는 쪽과 결합 방법을 적는다.
join_status = "방법만 정리함. HPD 위반 자료는 아직 붙이지 않았다."

background = """
#### 무엇을 가르려는가
311 난방 민원은 "춥다고 신고했다"는 기록이고, HPD 위반은 "점검원이 가서 기준 위반을 확인했다"는 기록이다.
두 자료를 건물 단위로 겹치면 네 칸이 생긴다.

| | 위반 많음 | 위반 적음 |
|---|---|---|
| **신고 많음** | 문제가 크고 잘 드러남 | 신고는 많은데 확인 안 됨(중복·점검 실패) |
| **신고 적음** | **과소신고 건물** | 조용하고 문제도 적음 |

#### Kontokosta의 과소신고 연구
Kontokosta 등은 311 신고량과 실제 건물 상태(점검·위반 자료)를 비교해, **같은 상태라도
저소득·이민자 비율이 높은 동네의 건물이 덜 신고된다**는 점을 보였다.
신고만 보고 점검 순서를 정하면 이런 건물이 뒤로 밀린다.

#### 우리 데이터에서 이미 보이는 것
난방 민원은 소수 건물에 크게 쏠려 있다. 신고된 건물의 상위 10%가 민원의 약 60%를 낸다.
쏠림 자체는 311만으로 보인다. 그 건물들이 **실제로** 문제인지는 위반 기록이 있어야 안다.
"""

method = """
**지금 한 것**
1. 2025-11 ~ 2026-05 `HEAT/HOT WATER` 민원 중 BBL이 있는 행을 건물(BBL)별로 셌다.
2. 건물을 민원 많은 순으로 줄 세워 누적 비율(집중 곡선)을 그렸다.

**결합 방법(다음 단계)**
1. NYC Open Data **Housing Maintenance Code Violations**(HPD)를 받는다. 필요한 열: `BBL`, `InspectionDate`, `Class`, `NOVDescription`.
2. 같은 기간(2025-11-01 ~ 2026-05-31), 난방·온수 관련 위반만 고른다(설명에 "heat" 또는 "hot water").
3. BBL을 10자리 문자열로 맞춘다(앞자리 0 주의).
4. 건물별 [311 난방 민원 수, 난방 위반 수]를 만들고 산점도와 네 칸 표를 그린다.
5. 연결률을 기록하고, 위반은 있는데 311이 0인 건물이 어느 동네에 몰리는지 ACS 소득과 겹쳐 본다.
"""

caveats = """
- 위반이 없다는 것은 "문제가 없다"가 아니라 "점검원이 확인하지 못했다"일 수 있다. 문을 안 열어 주면 점검이 안 된다.
- 위반 기록도 신고에서 출발하는 경우가 많다. 두 자료가 완전히 독립적이지 않다.
- BBL 하나에 건물 여러 동이 있는 단지는 '건물'이 아니라 '필지' 단위 비교가 된다.
"""

