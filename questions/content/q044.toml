concepts = ["simpson", "quintile"]
related = [45, 16, 31]

background = """
#### 결과
Tract 중위 가구소득과 1,000명당 민원의 순위 상관은 시 전체 **−0.13**이다. 약하게 '부유할수록 민원이 적다'.

자치구 안에서 따로 보면
- 브롱크스 −0.27
- 스태튼아일랜드 −0.24
- 맨해튼 −0.20
- 퀸스 −0.05
- **브루클린 +0.17**

네 자치구는 같은 방향(음수)인데 브루클린만 반대다.

#### 산점도 읽기
점 하나가 Tract 하나, 색이 자치구다. 브롱크스 점들은 왼쪽(저소득) 위에, 맨해튼 점들은 오른쪽으로 넓게 퍼진다.
시 전체의 약한 음의 관계는 이렇게 자치구마다 다른 구름이 겹쳐서 만든 모양이다.
"""

method = """
1. 소득이 있는 Tract(인구 1,000명 이상)별 1,000명당 민원과 중위 가구소득의 Spearman 상관.
2. 같은 계산을 자치구마다 따로 했다.
"""

caveats = """
- 상관이 약하다(−0.13). '법칙'이라고 부를 수준이 아니다.
- 1,000명당 민원은 상업 지구에서 크게 나온다. 산점도의 위쪽 1%는 그림에서만 뺐다.
"""
