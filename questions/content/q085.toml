concepts = ["median", "admin_closed"]
related = [82, 3, 9]

background = """
#### 평균 159.6시간, 중앙값 7.9시간
311 민원 하나가 닫히기까지 평균은 159.6시간(약 6.7일), 중앙값은 7.9시간이다. **20배** 차이다.
- 22%는 1시간 안에, 절반 가까이(47%)는 6시간 안에 닫힌다.
- 6% 남짓은 한 달이 넘게 걸리고, 1.3%는 3개월이 넘는다.

몇 달씩 걸리는 소수의 민원(가로등, 나무, 택시 청문)이 평균을 일주일 가까이 끌어올린다.
가장 긴 1%만 빼도 평균은 124시간으로 내려가지만, 중앙값은 거의 움직이지 않는다.

#### 어느 쪽을 써야 하나
- "보통 얼마나 걸리나?"에는 **중앙값**이 맞다. 한쪽 꼬리가 긴 분포에서 평균은 '보통'을 대표하지 못한다.
- "기관의 총 업무량, 밀린 일의 양"을 말할 때는 평균(또는 합계)이 의미 있다.
- 둘을 함께 쓰고, 꼬리가 궁금하면 90% 경계를 덧붙인다(→ 82번).
"""

method = """
1. 처리시간 = 종결 시각 − 접수 시각(시간). 음수(1,371건)는 뺐다. 미종결(약 4%)은 계산에서 빠진다.
2. 8개 구간으로 나눈 분포, 평균·중앙값, 가장 긴 1%를 뺀 평균.
"""

caveats = """
- 미종결 민원은 대부분 오래 걸리는 쪽이다. 이들이 빠졌으므로 실제 평균은 더 길다.
- 처리시간 0(접수와 동시에 종결)이 6만 건 넘게 있다. 자동 종결이 섞여 있다(→ 3번).
