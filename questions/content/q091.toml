concepts = ["ecological_fallacy", "majority_group"]
related = [18, 35, 33]

background = """
#### 쓰고 싶은 문장
"히스패닉 비율이 높은 동네에 민원이 많다. 그러니 히스패닉이 민원을 많이 낸다."

#### 무엇이 틀렸나
앞 문장은 **동네**에 대한 사실(Tract 상관 0.27)이고, 뒤 문장은 **사람**에 대한 주장이다.
- 311 공개 자료에는 신고자의 인종이 없다.
- 히스패닉 비율 60%인 동네의 신고자가 나머지 40%에서 나왔을 수도 있다.
- 이민자가 많은 건물에서는 영어를 잘하는 한 세대가 건물 전체를 대신해 신고하기도 한다.

#### 묶으면 더 강해 보인다
같은 관계를 히스패닉 비율 5분위로 묶어 다섯 점으로 보면 상관이 **1.00**이 된다. 동네 안의 다양성이 지워지기 때문이다(→ 18번).
묶은 숫자가 강할수록 '개인'에 대한 결론으로 착각하기 쉽다.

#### 말할 수 있는 것
"히스패닉 비율이 높은 동네일수록 민원율이 조금 높다. 이 동네들은 세입자·빈곤 비율도 높다(→ 35번)." 까지다.
"""

method = """
1. Tract(인구 1,000명 이상)의 히스패닉 비율과 1,000명당 민원의 Spearman 상관.
2. 히스패닉 비율 5분위로 묶은 다섯 점의 상관.
"""

caveats = """
- 원문 B6 섹션은 히스패닉 비율과 '소음' 민원율의 상관(0.38)을 예로 들었다. 이 페이지는 전체 민원율이다.
"""
