related_why = { 16 = "이 결합으로 임차율과 민원을 비교한다", 33 = "이 결합으로 인종 구성별 민원을 비교한다", 23 = "세입자 동네의 민원 구성이 어떻게 다른지 본다" }
lab = "small_denominator"
join_status = "이 프로젝트에서 실제로 합친 결합이다(311 좌표 → Census Tract → ACS)."

background = """
#### 이 프로젝트의 뼈대
311은 '무엇이 신고됐나'를, ACS(미국 지역사회 조사)는 '그곳에 누가 사나'를 알려 준다. 둘을 합치면 "어떤 동네가 무엇을 신고하나"를 물을 수 있다.
1–9부의 거의 모든 동네 비교가 이 결합 위에 서 있다.

#### 어떻게 합쳤나
1. 311 민원의 위도·경도로 2020년 Census Tract 경계 안에 점을 넣었다(공간 결합). 3,963,959건 중 **97.9%**(3,880,604건)가 Tract를 찾았다. 나머지는 좌표가 없다.
2. Tract의 GEOID로 ACS 2024 5개년 추정치(인구, 소득, 임차율, 인종, 주택 나이)를 붙였다.
3. 인구 1,000명 미만 Tract는 뺐다(→ 74번). 분석 대상 2,195개 Tract에 3,803,874건이 남았다.

#### 결과 한 장
자치구 × 분야로 보면 브롱크스는 주거(183건)·소음(153건)이, 퀸스·브루클린·스태튼아일랜드는 도로·교통이 두드러진다.
맨해튼은 주거와 소음이 비슷하게 높다.
"""

method = """
1. scripts/join_311_acs.py가 좌표 → Tract 결합(data/processed/nyc311_point_geoid.parquet)을 만든다.
2. 이 페이지는 분석 대상 Tract의 자치구 × 분야별 민원 ÷ 자치구 인구 × 1,000.
"""

caveats = """
- 좌표가 없는 2.1%(주소만 있거나 장소형 민원)는 동네 분석에서 빠진다. 특정 유형(택시, 일부 도로)에 몰려 있다.
- ACS는 5년 평균 추정치이고 Tract마다 오차가 있다. 작은 Tract일수록 오차가 크다.
"""
