background = """
#### 가장 가치 있는 결합
311은 '신고'를, HPD 위반 기록과 보건국 쥐 점검은 '실제로 확인된 문제'를 담는다. 둘을 건물(BBL)이나 좌표로 겹치면
**신고에 비해 문제가 많은 곳(과소신고)**과 **문제에 비해 신고가 많은 곳**이 갈린다. 과소신고 지도는 점검 순서를 바꿀 수 있는 결과다.

#### 311 안에서 미리 본 것
- **쥐**(→ 39번): 신고가 점검으로 이어졌을 때 위반이 나온 비율이 소득 최하위 동네 73%, 최상위 57%다. 가난한 동네의 신고일수록 '진짜'다.
- **난방**(→ 37번): 신고 1건이 '위반 발부'로 닫히는 비율은 히스패닉 비율과 상관없이 5% 안팎으로 같다.

#### 주의: 행정 순환
위반 기록과 점검의 상당수가 **311 신고에서 출발**한다(→ 93번). 그래서 둘을 겹칠 때는 신고와 무관한 기록(정기 점검, 순회 점검, 집주인 등록 점검)을 따로 골라야 과소신고를 공정하게 잴 수 있다.
"""

