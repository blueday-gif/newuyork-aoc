**결합 방법(다음 단계)**
1. NYC Open Data의 HPD Housing Maintenance Code Violations(BBL), DOHMH Rodent Inspection(좌표, BBL)을 받는다.
2. 점검이 311 신고에서 출발했는지(점검 유형·출처 열)를 가려 '신고 무관 점검'만 따로 둔다.
