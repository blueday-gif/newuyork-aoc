concepts = ["quintile", "per_capita", "reported_vs_occurred"]
related = [17, 23, 24, 44]
papers = ["minkoff_2016"]

background = """
#### 임차율
ACS에서 임차율은 '사람이 사는 주택 중 세 든 집의 비율'이다. 뉴욕은 세입자 비율이 매우 높은 도시로,
맨해튼·브롱크스에는 임차율이 아주 높은 Tract가 흔하고 스태튼아일랜드·퀸스 동쪽은 자가가 많다.

#### 얼마나 차이 나나
임차율 최하위 분위 동네는 1,000명당 343건, 최상위는 559건으로 1.6배다.
Tract 하나하나로 보면 순위 상관은 0.34로 중간 정도다. 점이 넓게 퍼져 있어 임차율만으로 민원을 예측하기는 어렵다.

#### 자치구 안에서도 그런가
자치구마다 소득·주택 유형·인구 구성이 다르므로 시 전체 상관은 자치구 차이가 섞인 값이다.
자치구 **안에서** 따로 계산해도 상관은 0.21–0.40으로 모두 양수다. 방향은 자치구와 상관없이 같다.

#### 왜 세입자 동네에 민원이 많나(가설)
- 집 안 문제(난방, 누수, 곰팡이)를 고칠 책임이 집주인에게 있어 **시에 신고할 이유**가 생긴다. 자가 소유자는 스스로 고친다.
- 공동주택은 벽 하나 사이에 이웃이 있어 소음 민원이 많다.
분야별로 나눠 보면 이 가설과 맞는 모양이 나온다(→ 23번).
"""

method = """
1. 민원 위치를 Tract에 붙였다(인구 1,000명 이상 Tract).
2. Tract를 임차율 순으로 5분위로 나눴다. 분위별 민원 합 ÷ 분위 인구 합 × 1,000.
3. Tract별 1,000명당 민원과 임차율의 Spearman 순위 상관을 시 전체와 자치구별로 구했다.
4. 산점도는 민원율 상위 1% Tract를 그림에서만 뺐다(통계에는 포함).
"""

caveats = """
- 분모는 거주 인구다. 상업 지구(맨해튼 미드타운 등)는 거주 인구가 적어 민원율이 크게 나온다.
- 11번의 이상치 주소(4.7만 건)가 임차율 최상위 분위 Tract에 있다. 빼면 최상위는 559건 → 535건(약 1.56배)으로, 결론은 같다.
- 임차율은 소득·인종 구성과 얽혀 있다. 임차율 '때문'이라고 말하려면 이들을 함께 통제해야 한다.
"""
