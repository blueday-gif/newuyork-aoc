concepts = ["institutional_change", "taxonomy_change"]
related = [10, 77, 81]
papers = ["data_quality_profiling"]

background = """
#### 원문의 예
- 2016년 노숙인 신고가 4배로 늘었다. 실제 노숙인 수가 아니라 노숙인 순찰(SCOUT) 도입과 언론 보도 때문이었다(DCJ).
- 2021년 공공주택(NYCHA) 민원이 311로 편입됐다. 그 해부터 주거 민원이 '늘어난' 것처럼 보인다.

#### 우리 자료 안에도 있다
이번 12개월 사이에 환경보호국(DEP)의 유형 이름이 바뀌었다.
- **하수도**: 'Sewer'가 2026년 7월 29일을 마지막으로 끊기고, 'Sewer Maintenance'가 이어받았다.
- **상수도**: 'Water System' → 'Water Maintenance'(7월에 두 이름이 섞이다가 8월부터 새 이름만).
- **유해 물질**: 'Hazardous Materials' → 'Hazardous Material'(끝의 s 하나).

옛 이름 'Sewer'만 세면 하수도 민원은 22,364건이고 8월부터 0이다. 두 이름을 합치면 34,648건이다.
"8월부터 하수도 민원이 사라졌다"는 기사가 나올 수 있는 구조다.

#### 교훈
숫자가 갑자기 뛰거나 끊기면 현실보다 먼저 **제도**를 의심한다. 유형 목록, 담당 기관, 접수 경로, 홍보가 그 무렵 바뀌었는지 확인하고,
옛 이름과 새 이름을 잇는 대응표를 만든다(→ 개념 '분류 목록의 변화').
"""

method = """
1. 유형별 첫 등장 월과 마지막 월을 보고, 한 해 안에서 끊기거나 새로 생긴 유형을 찾았다.
2. 옛 이름과 새 이름의 월별 건수를 나란히 그렸다.
"""

caveats = """
- 이름만 바뀌었는지, 세부 유형 구성까지 바뀌었는지는 세부 유형 목록을 비교해 확인해야 한다.
- 58번(소화전)처럼 이 유형들을 쓰는 다른 문항은 두 이름을 모두 셌다.
"""

