concepts = ["ecological_fallacy", "confounding", "stratification"]
related = [34, 36, 18]

background = """
#### 쓰고 싶은 문장
"히스패닉 동네 주거 민원이 백인 동네의 3.7배다. 히스패닉은 불평이 많다."

#### 두 가지 잘못
- **생태학적 오류**: 동네 단위 숫자로 집단 구성원 개인의 성향을 말했다(→ 18번).
- **인과의 착각**: 히스패닉 비율과 함께 움직이는 다른 변수가 진짜 원인일 수 있다.

#### 함께 움직이는 변수
Tract 단위에서 히스패닉 비율은 임차율과 0.44, 빈곤율과 0.41, 중위 가구소득과 −0.46의 상관이 있다.
히스패닉 비율이 높은 동네는 **세 든 집이 많고, 가난한 가구가 많은** 동네이기도 하다.
그런 동네에서 주거 민원이 많은 것은 인종이 아니라 집의 조건과 세입자의 처지로 설명될 수 있다.

흥미롭게도 1950년 이전 주택 비율과는 상관이 거의 없다(−0.01). '오래된 집'보다 '임대·빈곤'이 더 강하게 엮여 있다.

#### 그럼 어떻게 말할 수 있나
"히스패닉 비율이 높은 동네에서 주거 민원이 많다. 이 동네들은 세입자·빈곤 가구 비율도 높다." 까지가 데이터가 허락하는 문장이다.
소득을 맞춘 뒤에도 차이가 남는지는 36번에서 본다.
"""

method = """
1. Tract(인구 1,000명 이상)별 히스패닉 비율과 임차율·빈곤율·1950년 이전 주택 비율·중위 가구소득의 Spearman 상관.
"""

caveats = """
- 상관이 높아도 어느 쪽이 원인인지는 모른다. 여러 변수를 함께 넣은 모형으로도 인과까지는 말하기 어렵다.
"""
