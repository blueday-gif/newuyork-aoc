concepts = ["report_time", "same_period"]
related = [49, 52, 61]

background = """
#### 결과
1년 합계로 토요일 155,542건, 일요일 156,544건이고, 월요일은 94,593건이다. 주말이 월요일의 1.65배다.
금요일(108,833건)부터 오른다.

#### 주말의 차이는 언제 생기나
시각별 하루 평균을 평일과 주말로 나눠 보면, 낮에는 거의 같고 **밤 10시부터 새벽 3시** 사이에 크게 벌어진다.
자정에는 주말 하루 평균 301건, 평일 131건이다.
여기서 '주말 새벽'은 토·일요일 새벽, 곧 **금요일 밤과 토요일 밤**이다. 일요일 합계가 높은 것도 토요일 밤 늦게부터 새벽까지 들어온 신고 덕분이다.
"""

method = """
1. 소음 민원을 접수 요일별로 1년 합계를 냈다. 요일마다 날 수가 52일 안팎으로 같아 합계를 그대로 비교한다.
2. 평일·주말 시각별 하루 평균 = 그 시각 합계 ÷ 그 구분의 날 수.
"""

caveats = """
- 공휴일은 평일로 잡혔다. 7월 4일(토)처럼 주말과 겹친 날도 있다.
"""
