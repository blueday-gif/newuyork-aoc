둘째 날(11/2)은 9,467건으로 다른 날과 비슷하다.

#### 어디서 이런 경계가 생기나
자료를 '오늘부터 1년 전까지'처럼 시각 기준으로 뽑으면 처음과 끝이 하루 중간에서 잘린다.
월 단위로 묶을 때도 같다. 2025년 11월과 2026년 10월은 하루씩 모자라지 않지만, 첫날·마지막 날의 일부가 빠진다.

#### 교훈
'가장 적은 날', '가장 적은 달'이 자료의 맨 처음이나 맨 끝이면 먼저 의심한다. 정확한 시작·끝 시각을 확인하고, 잘린 칸은 빼거나 하루 평균으로 바꾼다.
