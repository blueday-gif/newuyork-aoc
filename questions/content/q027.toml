concepts = ["outlier", "accountability", "per_capita"]
related = [11, 28, 30]

background = """
#### 시의회 선거구
뉴욕시의회는 51개 선거구로 나뉘고, 선거구마다 시의원 한 명을 뽑는다. 선거구 인구는 대략 비슷하게(약 16–17만 명) 짠다.
311 원본에 'Council District' 열이 있어 경계를 따로 붙이지 않아도 **바로** 선거구별로 셀 수 있다.
원문 표시는 [결합]이지만 실제로는 지금 데이터로 답이 나온다.

#### 결과
- 51곳 중 33곳의 1위 민원이 **불법주차**다. 9곳은 난방, 6곳은 주거 소음이다.
- 맨해튼 남부 CD 03은 **노숙인 야영지**가, 퀸스 CD 24는 차량 소음이, CD 21은 진입로 막힘이 1위다.
- 민원이 가장 많은 선거구는 브롱크스 **CD 11**(143,229건)이다.

#### 성적표의 함정
CD 11 민원의 3분의 1(47,105건)은 **한 주소**(655 E 230th St, → 11번)에서 왔다. 이 주소를 빼면 9위로 내려간다.
"우리 구 민원 성적표"를 만들 때 가장 먼저 할 일은 상위 주소를 확인하는 것이다.
BetaNYC의 BoardStat은 커뮤니티보드 단위로 비슷한 성적표를 만든다.
"""

method = """
1. 원본 `Council District` 열(1–51). 비어 있는 2.6%는 뺐다.
2. 선거구별 전체 민원 수, 1위 유형과 그 비중.
3. 11번 이상치 주소(655 EAST 230 STREET)를 뺀 건수를 함께 표에 넣었다.
"""

caveats = """
- 건수 비교다. 선거구 인구가 대체로 비슷하지만 정확한 1인당 비교에는 선거구 인구(경계 + ACS)가 필요하다.
- 민원이 많은 선거구가 '못 하는' 선거구는 아니다. 시의원은 민원을 직접 처리하지 않는다(→ 28번).
"""

