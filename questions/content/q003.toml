concepts = ["admin_closed", "median", "definition"]
related = [1, 2, 4, 82]

background = """
#### 처리시간이란
311 처리시간은 **접수 시각부터 종결(Closed) 시각까지**다. 담당 기관이 그 건을 닫은 순간 시계가 멈춘다.
닫는 이유는 여러 가지다. 현장에서 치웠을 수도, 가 보니 문제가 없었을 수도, 아예 가지 않고 닫았을 수도 있다.

#### 폭설 때 생긴 일
결과문(Resolution Description)을 읽으면 답이 나온다. 이번 폭설 1주일 동안 스태튼아일랜드 눈 민원의 약 85%는
이런 문구로 닫혔다.

> 폭설 작업이 진행 중이라 개별 요청에는 대응할 수 없다. 신고는 시 전체 상황 파악에 쓰인다. (요약)

즉 **접수하자마자 일괄로 닫은 것**이다. 그래서 처리시간 중앙값이 0.4시간으로 짧다.
브루클린은 이 문구가 약 26%이고, 대부분은 "가 보니 위반이 없었다"로 닫혔다. 현장 확인을 거쳤기 때문에 오래 걸렸다.

#### 무엇을 말할 수 있나
"스태튼아일랜드가 제일 빨리 치웠다"는 틀렸다. 말할 수 있는 것은
"스태튼아일랜드 민원이 가장 빨리 **닫혔고**, 그 대부분은 현장 대응 없이 닫혔다"이다.
결과문이 "치웠다"(plowed, cleaned 등)인 민원은 시 전체에서 5%뿐이다.
"""

method = """
1. 2번과 같은 1주일 눈 민원.
2. 처리시간 = 종결 시각 − 접수 시각(시간). 음수는 뺐다. 자치구별 **중앙값**.
3. 결과문을 규칙으로 네 갈래로 묶었다.
   - "cannot respond to individual requests" → 개별 대응 불가(일괄 종결)
   - "no violation", "no condition" → 가 보니 문제 없음
   - "plowed", "cleaned", "salted", "removed" → 치움·청소함
   - 나머지 → 기타
"""

caveats = """
- "가 보니 문제 없음"도 늦게 가서 이미 녹았거나 누가 치운 뒤였을 수 있다.
- 결과문 규칙은 영어 문구 검색이라 새 문구가 생기면 '기타'로 빠진다. 기타 비율이 커지면 규칙을 다시 본다.
"""

