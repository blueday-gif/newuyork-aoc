concepts = ["admin_echo", "underreporting", "proxy"]
related = [39, 38, 7]

background = """
#### 쓰고 싶은 문장
"쥐 신고가 많은 동네에서 점검원이 실제로 쥐 문제를 더 많이 발견했다. 신고가 정확하다는 증거다."

#### 무엇이 틀렸나
이 '점검'은 **신고가 있어서** 나간 점검이다. 신고가 없는 곳에는 점검원이 가지 않는다.
그러니 '신고 많은 곳 = 점검 많은 곳 = 발견 많은 곳'이 될 수밖에 없다. 두 숫자는 같은 신고의 메아리다.

#### 숫자로 보면
Tract마다 쥐 신고 수와, 그 신고에 대한 점검에서 위반이 발견된 수의 순위 상관은 **0.85**다. 산점도는 거의 직선이다.
쥐 신고의 49%가 점검까지 갔고, 나머지는 중복·점검 불가 등으로 닫혔다.

#### 그럼 39번은?
39번은 '건수'가 아니라 '점검했을 때 위반이 나온 **비율**'을 비교했다. 비율은 신고 수의 메아리에서 조금 자유롭지만,
점검 대상 자체가 신고로 골라졌다는 한계는 그대로다. 확실히 하려면 신고와 무관한 **정기 점검**(쥐 정보 포털의 지역 순회 점검)과 비교해야 한다.
"""

method = """
1. 쥐 민원을 Tract에 붙이고, 결과문으로 점검 여부(위반 발견 또는 통과)와 위반 발견을 가렸다(→ 39번).
2. Tract별 신고 수와 위반 발견 수의 Spearman 상관.
"""

caveats = """
- 보건국은 신고와 별개로 지역 단위 순회 점검도 한다. 그 결과는 311에 없고 쥐 정보 포털·Open Data에 있다.
"""
