background = """
#### 최악의 집주인 목록
뉴욕시 공익옹호관(Public Advocate)은 해마다 '최악의 집주인 목록'(Worst Landlords Watchlist)을 낸다.
HPD 위반이 많은 건물을 가진 집주인을 순위로 공개한다. 목록에는 건물 주소와 BBL이 있다.

#### 바로 맞춰 볼 수 있다
311 HPD 민원은 대부분 BBL을 갖고 있어서, 목록의 BBL과 맞추면 "민원 상위 건물이 목록에 있나"를 바로 확인할 수 있다.
지금은 311 쪽만 계산했다. HPD 주거 민원이 많은 상위 15개 건물 중 7곳이 브롱크스에 있다.

#### 보도할 때 주의
목록에는 **집주인 이름**이 나온다. 실명이 나오는 보도는 다음을 꼭 확인한다.
- BBL은 필지다. 한 BBL에 건물 여러 동이 있는 큰 단지(예: 브롱크스 1 Metropolitan Oval, 주소 표기 30가지, BBL 4개)는 '한 건물'처럼 보여도 수천 세대다.
- 민원이 많은 것과 위반이 많은 것은 다르다(→ 70번).
- 소유주가 최근에 바뀌었을 수 있다. 목록 연도와 민원 기간을 맞춘다.
"""

method = """
**지금 한 것**: HPD 민원(BBL 있음)을 BBL별로 세어 상위 15개 건물, 민원 유형 수, 결과문 '위반 발부' 건수를 구했다.

**결합 방법(다음 단계)**
1. 공익옹호관 웹사이트에서 최신 목록(건물 주소, BBL, 집주인)을 받는다.
2. BBL을 10자리 문자열로 맞춰 311 HPD 민원 집계와 붙인다.
3. 목록 건물의 민원율(세대당, PLUTO 세대 수)과 목록 밖 건물을 비교한다.
"""

caveats = """
- 큰 단지는 세대 수로 나눠야 공정하게 비교할 수 있다. 민원 수 순위는 큰 건물이 늘 위에 온다.
"""

