background = """
#### 질문
투표와 311 신고는 둘 다 "정부에 목소리를 내는" 행동이다. 같은 동네에서 둘이 함께 높다면
그 뒤에 '참여 성향'이라는 숨은 변수가 있다고 이야기할 수 있다. Minkoff(2016)가 말한 **신고 성향**이다.

#### 우리 데이터에서 보이는 것
- 신고 **양**: 1,000명당 민원은 소득 최하위 508건, 최상위 418건이다. 저소득 동네가 더 많이 신고한다.
- 신고 **방식**: 전화 비율이 소득 최하위 27%에서 최상위 19%로 내려간다. 고소득 동네는 웹을 더 쓴다.
투표율은 대체로 고소득 동네가 높다. 그렇다면 311 신고량과 투표율은 **같은 방향이 아닐 수 있다**.
"참여"를 하나의 성향으로 묶을 수 있는지, 아니면 두 행동이 서로 다른 필요에서 나오는지가 결합 뒤의 질문이다.

#### 신고 경로가 말해 주는 것
전화는 영어 외 언어 지원을 받기 쉽고, 앱은 사진과 위치를 붙이기 쉽다.
경로 차이는 '얼마나 신고하나'뿐 아니라 '어떻게 신고할 수 있나'의 차이이기도 하다.
"""

