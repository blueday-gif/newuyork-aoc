concepts = ["hpd", "heat_season", "reported_vs_occurred", "data_join"]
related = [4, 5, 7]

background = """
#### 신고와 처분 사이
감사관 보고서는 2017–2021년 난방 신고 약 100만 건에 실제 위반 처분이 21,610건이었다고 했다. 약 46배다.
신고 한 건이 바로 처분으로 이어지지 않는 이유는 여러 겹이다.
- 한 건물에서 여러 세대가 신고한다(중복, → 4번).
- 점검원이 갔을 때 이미 난방이 돌아왔다.
- 점검원이 집에 들어가지 못했다.
- 점검에서 법정 기준(→ 개념 '난방 시즌 규정') 아래로 확인되지 않았다.

#### 우리 데이터로 할 수 있는 것
311 데이터에는 위반 기록이 없다. 대신 결과문에 "위반이 발부됐다(Violations were issued)"는 문구가 있는 민원을 셀 수 있다.
이번 시즌 난방 민원 308,677건 중 약 4.8%(14,969건)다.
이것은 **위반 건수가 아니다**. 위반 한 건에 민원 여러 건이 묶이기도 하고, 위반 여러 건이 한 결과문에 들어가기도 한다.
정확한 비율은 HPD 위반 기록을 BBL로 붙여야 나온다(→ 7번).

#### 계절
난방 민원은 1월에 정점(약 8만 건)이고 여름에는 월 4천 건 안팎이다.
여름에도 민원이 남는 것은 온수 기준이 1년 내내 적용되기 때문으로 보인다(이 유형은 난방과 온수를 한데 묶어서 둘을 가를 수 없다).
"""

method = """
1. 감사관 수치(약 100만 건, 21,610건)는 보고서에서 옮겼다. 우리가 계산한 값이 아니다.
2. 월별 난방 민원: `HEAT/HOT WATER`를 접수 월로 셌다.
3. 결과문 '위반 발부': 2025-11 ~ 2026-05 난방 민원의 결과문을 4번과 같은 규칙으로 분류했다.
"""

caveats = """
- 보고서 기간(2017–2021, 5시즌)과 우리 기간(1시즌)이 다르다. 46배와 우리 비율을 직접 비교하지 않는다.
- 결과문 분류는 문구 검색이다. "점검(결과는 HPD 사이트)"으로 닫힌 건 중에도 위반이 난 건이 섞여 있다.
"""

[[sources]]
title = "NYC 감사관 — Turn Up the Heat"
