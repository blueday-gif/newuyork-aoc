concepts = ["spurious", "seasonality"]
related = [53, 62, 56]

background = """
#### 원문의 예
원문은 "아이스크림 트럭 소음과 불꽃놀이가 12개월 동안 함께 오른다(둘 다 여름)"를 가짜 상관의 예로 들었다.

#### 실제로 재 보니
월별 12개 점의 상관은 **+0.15**로 약하다.
- 아이스크림 트럭 소음은 **4–6월**에 가장 많다(봄에 트럭이 나오기 시작할 때 민원이 몰린다).
- 불법 불꽃놀이는 **7월 한 달**(6,923건)에 1년치의 64%가 몰린다.
'둘 다 여름'이라는 느낌과 달리 정점이 다른 달에 있어서 함께 움직이지 않는다.

#### 진짜 가짜 상관
대신 **아이스크림 트럭 소음과 난방 민원**의 상관은 **−0.86**이다. 아이스크림이 난방을 줄일 리 없다.
둘 다 '계절'이라는 같은 원인을 반대 방향으로 따를 뿐이다. 점이 12개뿐이고 계절이 강하면 이런 숫자가 쉽게 나온다.

#### 교훈
가짜 상관을 예로 들 때도 실제로 계산해 봐야 한다. 그리고 상관이 강하게 나와도, 둘을 잇는 경로가 없으면 의심한다.
"""

method = """
1. 월별 건수: 세부 유형에 'Ice Cream'이 들어간 민원(→ 62번), `Illegal Fireworks`, `HEAT/HOT WATER`.
2. 12개월 건수의 피어슨 상관.
3. 차트는 각 유형의 가장 많은 달을 100으로 맞췄다.
"""

caveats = """
- 12개 점의 상관은 매우 불안정하다. 한 달(7월)이 바뀌면 상관도 크게 바뀐다.
"""

