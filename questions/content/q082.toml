#### 가장 오래 걸리는 민원
- **가로등 고장**: 중앙값 239시간(약 10일), 평균 433시간. **15.4%**는 아직 닫히지 않았다.
- **쥐**: 중앙값 141시간(약 6일). 보건국 점검 일정을 잡아야 한다.
- **손상된 나무**: 중앙값 69시간(약 3일)이지만 평균 334시간, 미종결 19.5%. 금방 닫히는 건과 몇 주씩 걸리는 건이 섞여 있다.
- **난방**: 중앙값 43시간.
- **불법주차** 1.5시간, **주거 소음** 1.2시간: 경찰이 순찰 중에 들러 닫는다.

#### 중앙값과 평균
전체 민원의 처리시간은 중앙값 7.9시간, 평균 160시간이다. 20배 차이다.
대부분 몇 시간 안에 닫히지만, 몇 달씩 걸리는 꼬리가 평균을 끌어올린다(→ 개념 '중앙값과 평균').
'90% 경계'(10건 중 9건이 이 시간 안에 닫힘)를 함께 보면 꼬리의 길이를 알 수 있다. 가로등은 1,009시간(약 6주)이다.

#### 속도는 기관과 일의 성격이 정한다
수리 부품과 작업반이 필요한 일(가로등, 나무)은 느리고, 현장 확인만 하면 되는 일(주차, 소음)은 빠르다.
그래서 처리 속도의 '공정성'은 같은 유형 안에서만 비교한다(→ 9번).
"""

method = """
1. 처리시간 = 종결 시각 − 접수 시각(시간). 음수는 뺐다. 미종결은 처리시간 계산에서 빠진다.
