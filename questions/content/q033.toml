concepts = ["majority_group", "per_capita", "ecological_fallacy", "outlier"]
related = [34, 35, 43, 11]

background = """
#### 동네를 어떻게 나눴나
인구 1,000명 이상 Tract를 '인구의 50% 이상을 차지하는 집단'으로 나눴다. 히스패닉 다수 396개, 흑인 다수 391개,
백인 다수 609개, 아시아계 다수 133개, 과반 없음 666개다. 뉴욕은 '과반 없음' 동네가 가장 많다.

#### 결과
1,000명당 민원은 히스패닉 다수 540.6건, 과반 없음 469.5건, 흑인 다수 463.5건, 백인 다수 379.4건, 아시아계 다수 341.2건이다.
가장 많은 집단과 가장 적은 집단의 차이는 1.6배다.

#### 한 주소가 숨어 있다
11번의 이상치 주소(655 E 230th St, 4.7만 건)가 흑인 다수 Tract에 있다. 이 주소 하나가 흑인 다수 집단 전체의 민원율을
1,000명당 36건 끌어올린다. 빼면 427.3건이다. 순위는 그대로지만 '과반 없음'과의 차이가 벌어진다.

#### 이 숫자가 말하지 않는 것
이것은 **동네**의 비교다. "히스패닉이 민원을 많이 낸다"는 뜻이 아니다(→ 35번).
그 동네에 누가 살고, 집이 어떻고, 누가 신고했는지는 이 숫자에 들어 있지 않다.
"""

method = """
1. ACS 2024 5개년의 히스패닉(인종 무관), 비히스패닉 흑인·백인·아시아계 비율.
2. 가장 큰 비율이 50% 이상이면 그 집단의 다수 Tract, 아니면 '과반 없음'.
3. 집단별 민원 합 ÷ 집단 인구 합 × 1,000.
"""

caveats = """
- 50% 기준은 연구자의 선택이다. 기준을 바꾸면 집단 크기와 숫자가 바뀐다.
- 비히스패닉 다인종·기타 집단은 따로 나누지 않았다.
"""
