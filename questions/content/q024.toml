concepts = ["rent_stabilization", "confounding", "data_join", "bbl"]
related = [15, 16, 23]
join_status = "방법만 정리함. RGB 건물 목록 → PLUTO → Tract로 만드는 '안정화 비율' 변수는 아직 없다."

background = """
#### 질문
임차율이 같은 동네끼리 비교해도 **안정화 아파트가 많은 동네**는 민원이 다를까?

#### Met Council의 가설
세입자 단체 Met Council은 시장가(비안정화) 세입자가 **보복이 두려워** 신고를 덜 한다고 본다.
시장가 세입자는 계약 갱신이 보장되지 않아, 민원을 내면 재계약을 거절당하거나 큰 폭의 인상을 받을 수 있다.
안정화 세입자는 갱신 권리가 있어 상대적으로 안전하다.
이 가설이 맞다면 **임차율이 같아도 안정화 비율이 높은 동네의 주거 민원이 더 많아야** 한다.

#### 이미 보이는 것: 남는 차이가 크다
임차율 최상위 분위(87% 이상) Tract만 모아도 주거 민원은 크게 다르다.
상위 25% 동네는 하위 25% 동네의 약 4배다. 임차율로는 설명되지 않는 이 차이를
안정화 비율이 얼마나 설명하는지가 이 문항의 질문이다.
"""

method = """
**지금 한 것**: 임차율 최상위 분위 Tract(439개) 안에서 자치구별 1,000명당 주거 민원의 사분위수를 구했다.

**결합 방법(다음 단계)**
1. RGB 안정화 건물 목록(BBL)을 받는다.
2. PLUTO에서 각 BBL의 주거 세대 수(`UnitsRes`)와 Census Tract를 가져온다.
3. Tract별 '안정화 건물의 세대 수 ÷ 전체 세대 수'를 구한다. 건물 안 일부만 안정화인 경우가 있어 근사치다.
4. 주거 민원율을 임차율·소득·안정화 비율로 회귀하거나, 임차율 분위 안에서 안정화 비율 분위별로 비교한다.
"""

caveats = """
- 안정화 건물은 대체로 오래됐다. 안정화 비율의 효과와 노후 효과(→ 20번)를 가르려면 둘 다 넣어야 한다.
- 신고가 많다는 것은 '문제가 많다'일 수도, '신고하기 안전하다'일 수도 있다. 가설을 가르려면 위반 기록(→ 7번)이 필요하다.
"""

