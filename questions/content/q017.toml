concepts = ["confounding", "ecological_fallacy", "data_join"]
related = [16, 18, 25]
join_status = "결합함(2026-11-27). 선관위 2025 시장 선거 선거구(ED)별 개표(후보 득표 2,187,998표)를 주거 세대 수 비율로 Tract에 나눠 붙였다. 맘다니 득표율은 임차율 최하위 분위 31.8%에서 최상위 62.1%로 오르고, 1,000명당 민원도 함께 오른다. 통제 없이 본 Tract 상관은 ρ 0.33이고, 임차율이 비슷한 동네끼리(5분위 안) 보면 0.09~0.32(중앙값 0.26)로 줄지만 사라지지 않는다. 소득·인종 같은 다른 공통 원인은 아직 통제하지 않았다."

background = """
#### 선거 지리
2025년 시장 선거 초기 개표 분석에 따르면 맘다니는 세입자가 많은 지역에서 약 20%p 차로 이겼고,
자가 소유자가 많은 지역에서는 졌다. 임대료 동결이 핵심 공약이었으니 자연스러운 결과다.

#### 계산은 할 수 있다
선거구(Election District, ED)별 득표를 Tract에 붙이면 "맘다니 득표율 × 민원율" 상관을 구할 수 있다.
ED와 Tract는 경계가 다르므로 **면적 비율**(또는 인구 비율)로 나눠 붙인다.

#### 그러나 상관만으로는 의미가 없다
맘다니 득표율도 임차율을 따라가고, 민원율도 임차율을 따라간다(→ 16번).
두 변수가 함께 높게 나와도 **임차율이라는 공통 원인** 때문일 수 있다.
진짜 질문은 "임차율이 같은 동네끼리 비교해도 맘다니 표와 민원이 함께 움직이는가"이다.

#### 차트 읽기
'통계' 차트는 통제해야 할 쪽(임차율)이 민원과 얼마나 강하게 엮여 있는지 보여 준다.
자치구마다 임차율 분위가 오를 때 민원율이 대체로 함께 오른다. 이 정도로 엮인 공통 원인이 있으면 통제 없이 낸 상관은 믿기 어렵다.

'결합 결과'의 첫 차트에서는 득표율도 같은 모양으로 오른다. 산점도를 색(임차율 분위)별로 보면, 같은 색 안에서도 오른쪽 위로 기우는 경향이 약하게 남는다.
임차율이 낮은 두 분위에서는 거의 없고(ρ 0.10, 0.09), 높은 세 분위에서 0.26~0.32다.
"""

method = """
**결합 방법(Phase 3B에서 실행)**
1. 선관위 2025 총선 ED별 시장 개표 CSV(5개 자치구)와 시 계획국 ED 경계(nyed_25c)를 받았다. 후보 행만 쓰고, 같은 후보의 여러 정당 줄은 합쳤다.
2. PLUTO 주거 필지 좌표를 ED와 Tract에 각각 붙여, ED의 표를 그 ED 안 주거 세대 수 비율로 Tract에 나눴다. 주거 세대가 없는 ED 75곳(표의 1.6%)만 겹친 면적 비율로 나눴다.
3. 받은 표가 100표 미만인 Tract 3곳은 득표율에서 뺐다(작은 분모).
4. Tract별 맘다니 득표율(맘다니 ÷ 후보 득표 합)과 1,000명당 민원의 스피어만 상관(ρ)을 전체와 임차율 5분위 안에서 구했다.
"""

caveats = """
- 면적 배분은 사람이 고르게 산다고 가정한다. 공원·공항이 낀 ED는 왜곡된다. 그래서 주거 세대 수로 배분하고, 세대가 없는 ED만 면적을 썼다(→ 99번).
- 임차율만 통제했다. 소득·인종·연령 구성도 표와 민원을 함께 움직일 수 있다.
- 득표율의 분모는 후보 득표 합이다(빈 표·기타 기명 제외).
- 통제 뒤에도 관계가 남아도 개인의 동기를 말할 수는 없다(→ 18번).
"""

