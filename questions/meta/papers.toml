finding = """
고위험 침수 Tract 거주자 1,003,940명(시 인구의 12%) 중 433,079명은 홍수 민원이 한 건도 없는 Tract에 산다.
113,738명은 311·센서·저류 모델 어디에도 잡히지 않는다. 백인·아시아계 비율, 소득, 아동 비율이 높을수록 신고 확률이 높고 히스패닉 비율이 높을수록 낮다.
"""
differs = "이 프로젝트는 100번에서 '1년 내내 홍수 민원 0건인 Tract'까지만 셌다. 센서·위험 지도가 없어 0건이 '안전'인지 '미신고'인지 가르지 못한다."

