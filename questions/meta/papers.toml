[ramphal_2022]
title = "Ramphal 등: 팬데믹 소음 민원의 역설"
who = "Ramphal 등, 2022, Environmental Research"
track = 4
question = "봉쇄로 도시가 조용해졌다면 소음 민원도 줄었을까?"
