finding = "오히려 저소득 지역·여름철 중심으로 늘었다. 7월 소음 민원 증가율은 2019~2020년에 저소득 사분위 103%, 고소득 사분위 50%였다(2010~2019년 평균은 29%, 11%)."
differs = "이 프로젝트는 2025-11~2026-10 한 해라 팬데믹 전후 비교를 할 수 없다. 이번 해의 계절·소득 차이만 본다(67번)."
