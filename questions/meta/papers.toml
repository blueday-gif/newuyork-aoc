finding = "6가지 민원이 함께 나오는 건물(평균 리프트 8.48)은 민원 이전에도 세대당 위반율이 12~44배 높았다(26세대 이상은 44배)."
differs = "이 프로젝트는 위반 기록을 붙이지 않아 '이전 시간창' 검증을 할 수 없다. 12개월치라 시간창도 짧다(72·93번)."

