[ikrar_building_syndrome]
title = "ikrar.dev: '건물 증후군' 마이닝"
who = "ikrar.dev 독립 프로젝트"
track = 2
question = "어떤 민원들이 한 건물에 함께 나타나고, 그런 건물은 실제로 상태가 나쁜가?"
