# 여러 문항이 함께 쓰는 개념 카드. 문항 해설(content/q###.toml)의 concepts 목록에 키를 적는다.
# 새 개념은 [키] 표 하나로 추가한다. kind: "통계" | "311" | "뉴욕" | "데이터"

[reported_vs_occurred]
title = "신고된 문제 ≠ 일어난 문제"
kind = "311"
summary = "311 건수는 문제의 크기가 아니라 '누가, 얼마나 신고했는가'를 잰다."
body = """
311 민원 1건은 누군가 전화, 앱, 웹으로 신고했다는 기록이다. 같은 문제가 있어도
신고할 줄 알고, 신고하면 해결된다고 믿고, 시간이 있는 사람이 많은 동네에서 건수가 많다.
그래서 311은 **수요(신고 성향)와 공급(실제 문제)이 섞인 신호**다.
문제를 직접 보여 주는 자료(HPD 위반 기록, 기상 관측, 센서 등)와 비교해야 둘을 가를 수 있다.
"""

[per_capita]
title = "인구당 비율(10만 명당)"
kind = "통계"
summary = "건수를 인구로 나눠야 크기가 다른 지역을 비교할 수 있다."
body = """
자치구 인구는 스태튼아일랜드 약 49만 명, 브루클린 약 263만 명으로 다섯 배 넘게 차이 난다.
건수를 그대로 비교하면 큰 지역이 늘 위에 온다. **비율 = 건수 ÷ 인구 × 100,000**으로 바꾸면
"사람 수가 같다면"이라는 조건에서 비교할 수 있다.

단, 분모가 적절한지도 따져야 한다. 눈 민원은 인구보다 **도로 길이**나 **단독주택 수**가
더 맞는 분모일 수 있다. 분모를 바꾸면 순위가 바뀌는지 확인하는 것이 좋은 습관이다.
"""

[outlier]
title = "이상치(outlier)"
kind = "통계"
summary = "값 하나가 합계와 추세를 통째로 바꿀 수 있다. 합계를 보기 전에 상위 항목을 본다."
body = """
이상치는 나머지와 동떨어진 값이다. 합계와 평균은 이상치에 약하고, 중앙값은 강하다.
311에서는 한 사람(또는 소수)이 같은 주소를 수만 번 신고하는 일이 실제로 있다.
**확인 순서**: ① 상위 10개 주소·건물을 표로 본다 → ② 그것을 빼고 다시 계산한다 →
③ 결론이 바뀌면 "이상치 때문"이라고 명시한다. 이상치를 지울지는 질문에 달렸다.
"동네가 시끄러운가"를 묻는다면 빼고, "311 업무량"을 묻는다면 남긴다.
"""

[same_period]
title = "같은 기간끼리 비교"
kind = "통계"
summary = "기간의 길이, 시작 달, 계절이 다르면 증감을 말할 수 없다."
body = """
'2024년(1–12월)'과 '2025-11 ~ 2026-10'은 둘 다 12개월이지만 다른 겨울과 다른 여름을 담는다.
난방처럼 계절성이 강한 민원은 시작 달만 바꿔도 합계가 달라진다.
증감을 말하려면 **같은 달 범위, 같은 유형 정의, 같은 추출 방식**을 맞춘다.
"""

[bbl]
title = "BBL(Borough-Block-Lot)"
kind = "데이터"
summary = "뉴욕시 필지 고유번호. 자치구 1자리 + 블록 5자리 + 필지 4자리 = 10자리."
body = """
BBL은 뉴욕시 재무국이 땅(필지)에 붙인 번호다. 첫 자리는 자치구
(1 맨해튼, 2 브롱크스, 3 브루클린, 4 퀸스, 5 스태튼아일랜드)다.
311, HPD 위반 기록, DOB 건축 허가, PLUTO(필지 속성)가 모두 BBL을 갖고 있어
**건물 단위로 여러 자료를 합치는 열쇠**가 된다. 큰 단지는 필지 하나에 건물이 여러 동일 수 있다.
"""

[hpd]
title = "HPD(주택보존개발국)"
kind = "뉴욕"
summary = "뉴욕시 주거 건물의 유지·관리 기준을 단속하는 기관. 난방·누수·곰팡이 민원을 맡는다."
body = """
Department of Housing Preservation and Development. 311로 들어온 주거 민원을 받아
집주인에게 연락하거나 점검원을 보낸다. 점검에서 기준 위반이 확인되면 **위반(violation)**을 발부한다.
위반은 위험도에 따라 A(비위험), B(위험), C(즉시 위험)로 나뉜다.
위반 기록은 NYC Open Data에 BBL과 함께 공개된다.
"""

[heat_season]
title = "난방 시즌 규정"
kind = "뉴욕"
summary = "10월 1일 ~ 5월 31일, 집주인은 실내 최저 온도를 지켜야 한다."
body = """
뉴욕시 주택 관리 규정에 따라 난방 시즌에는
**낮(6–22시)**에 바깥 기온이 55°F(약 13°C) 아래로 내려가면 실내를 68°F(20°C) 이상,
**밤(22–6시)**에는 바깥 기온과 상관없이 62°F(약 17°C) 이상으로 유지해야 한다.
온수는 1년 내내 120°F(약 49°C) 이상이어야 한다.
"""

[concentration]
title = "집중도(소수가 다수를 차지함)"
kind = "통계"
summary = "상위 몇 %가 전체의 몇 %를 차지하는지 보면 '고르게 퍼진 문제'인지 '소수에 쏠린 문제'인지 알 수 있다."
body = """
값을 큰 순서로 줄 세우고 누적 비율을 그리면 **집중 곡선**이 된다.
완전히 고르면 대각선(상위 10%가 10%)이고, 위로 볼록할수록 쏠려 있다.
쏠린 문제는 **정책 대상을 좁힐 수 있다**는 뜻이기도 하다. 상위 건물만 집중 점검하는 식이다.
"""

[data_join]
title = "두 자료 합치기(join)"
kind = "데이터"
summary = "같은 열쇠(BBL, 날짜, GEOID)를 가진 두 표를 이어 붙인다. 열쇠의 형식과 기간부터 맞춘다."
body = """
**확인 순서**: ① 열쇠의 형식(자릿수, 문자/숫자, 앞자리 0)을 맞춘다 →
② 두 자료의 기간을 맞춘다 → ③ 연결률(몇 %가 짝을 찾았나)을 기록한다 →
④ 짝을 못 찾은 행이 특정 지역·유형에 몰리는지 본다.
연결률이 낮거나 치우치면 결과도 치우친다.
"""

[admin_closed]
title = "종결(Closed) ≠ 해결"
kind = "311"
summary = "처리시간은 행정 처리 속도다. 현장에서 문제가 풀렸다는 뜻이 아니다."
body = """
311 민원의 '종결'은 담당 기관이 그 건을 닫았다는 표시다.
중복으로 묶거나, 점검원이 갔는데 아무도 없었거나, 다른 기관으로 넘겼을 때도 닫힌다.
결과문(Resolution Description)을 함께 읽어야 실제 조치를 알 수 있다.
"""

[median]
title = "중앙값과 평균"
kind = "통계"
summary = "줄 세웠을 때 가운데 값. 몇 개의 아주 큰 값에 끌려가지 않는다."
body = """
처리시간은 대부분 몇 시간 안에 끝나고 일부가 몇 주씩 걸린다. 이렇게 한쪽 꼬리가 긴 분포에서는
평균이 꼬리 쪽으로 끌려가서 '보통의 경우'를 대표하지 못한다. 그래서 처리시간은 **중앙값**으로 비교한다.
다만 중앙값도 '절반이 이 시간 안에 닫혔다'는 뜻일 뿐, 늦게 닫힌 건이 얼마나 늦었는지는 알려 주지 않는다.
필요하면 90번째 백분위수(상위 10% 경계)를 함께 본다.
"""

[quintile]
title = "5분위(quintile)"
kind = "통계"
summary = "값 순서로 줄 세워 같은 개수씩 다섯 묶음으로 나눈 것. Q1이 가장 낮고 Q5가 가장 높다."
body = """
여기서는 인구 1,000명 이상 Tract 2,195개를 **중위 가구소득** 순으로 줄 세워 약 439개씩 다섯 묶음으로 나눴다.
'최하위 분위'는 동네 단위 구분이다. 그 동네에 사는 모든 사람이 저소득이라는 뜻이 아니다.
분위마다 Tract 수는 같지만 **인구와 민원 수는 다르다**. 건수를 비교할 때는 인구당 비율도 함께 본다.
"""

[compare_like]
title = "같은 것끼리 비교"
kind = "통계"
summary = "처리 속도는 같은 유형, 같은 기관 안에서만 비교한다. 섞으면 구성 차이가 속도 차이로 보인다."
body = """
불법주차는 경찰이 1–2시간 안에 닫고, 난방은 HPD가 이틀쯤 걸린다. 부유한 동네에 불법주차 신고가 많으면
그 동네의 '전체 평균 처리시간'은 짧아진다. 서비스가 빨라서가 아니라 **민원 구성**이 달라서다.
그래서 "어느 동네가 더 빨리 처리받나"는 **유형별로 따로** 계산하고, 유형마다 방향이 같은지 확인한다.
"""

[definition]
title = "정의가 다르면 다른 숫자"
kind = "통계"
summary = "같은 말('5회 초과', '중복', '종결')도 기간·분모·조건이 다르면 다른 숫자가 된다."
body = """
숫자를 비교하기 전에 세 가지를 맞춘다. ① **기간**(한 시즌인가, 5년 연속인가)
② **분모**(전체 건물인가, 신고된 건물인가) ③ **조건**(초과인가 이상인가, 연속인가 누적인가).
보고서와 우리 계산이 다르면 누가 틀렸는지보다 정의가 어떻게 다른지를 먼저 찾는다.
"""

[report_fatigue]
title = "신고 피로"
kind = "311"
summary = "신고해도 소용없다고 느끼면 사람들은 신고를 멈춘다. 민원 감소가 문제 감소가 아닐 수 있다."
body = """
311 건수는 문제의 양과 신고 의지를 곱한 값에 가깝다. 같은 문제가 계속되는데 처리가 안 되면
신고 의지가 줄고 건수도 준다. 그래서 311을 **성과 지표**로 쓰면 위험하다.
"민원이 줄었다"를 확인하려면 점검·위반 기록, 현장 조사, 재신고율처럼 신고와 독립된 자료를 함께 본다.
"""

[taxonomy_change]
title = "분류 목록의 변화"
kind = "데이터"
summary = "311 민원 유형 이름은 해마다 바뀌고 합쳐진다. 여러 해를 비교하려면 유형 대응표가 필요하다."
body = """
311 유형은 기관이 업무를 바꿀 때마다 새로 생기거나 이름이 바뀐다(예: 'Dirty Sidewalk' → 'Dirty Condition').
옛 이름으로 세면 감소, 새 이름으로 세면 급증처럼 보인다. 여러 해를 비교할 때는
① 해마다 유형 목록을 뽑고 ② 사라진 이름과 새로 생긴 이름을 짝지은 **대응표**를 만든 뒤 ③ 대응표 기준으로 센다.
"""

[duplicate]
title = "중복 민원"
kind = "311"
summary = "같은 문제를 여러 사람이 신고하면 하나를 남기고 나머지는 '중복'으로 닫는다."
body = """
난방은 보일러 하나가 건물 전체에 영향을 주므로 여러 세대가 거의 동시에 신고한다.
HPD는 건물 단위로 하나를 열어 두고 나머지를 '건물 전체 상태로 이미 접수됨'으로 닫는다.
그래서 **민원 수는 '추위를 겪은 세대 수'에 가깝고, 처리 대상 수는 '건물 수'에 가깝다.**
중복 비율은 문제가 클수록(한파) 오른다.
"""

[seasonality]
title = "계절성"
kind = "통계"
summary = "해마다 같은 시기에 반복되는 오르내림. 전후 비교에서 정책 효과로 착각하기 쉽다."
body = """
난방은 1월, 소음은 여름, 눈은 겨울에 오른다. 어떤 날짜를 기준으로 "전"과 "후"를 나누면
계절 변화가 그대로 "효과"처럼 보인다. 계절을 떼어 내는 방법은 세 가지다.
① **작년 같은 달**과 비교한다 ② 계절의 원인(기온 등)을 직접 넣는다 ③ 계절을 함께 겪은 **비교 집단**을 둔다(→ 이중차분).
"""

[did]
title = "이중차분(difference-in-differences)"
kind = "통계"
summary = "정책을 받은 집단과 받지 않은 집단의 '변화량'끼리 빼서, 두 집단이 함께 겪은 변화(계절 등)를 지운다."
body = """
동결은 안정화 아파트에만 적용된다. 그러니 안정화 건물(처리군)과 비안정화 건물(대조군)의 민원이
동결 전후에 **각각 얼마나 변했는지** 구하고, 그 차이를 본다.
**효과 ≈ (처리군 후 − 처리군 전) − (대조군 후 − 대조군 전)**.
전제는 "정책이 없었다면 두 집단이 나란히 움직였을 것"(평행 추세)이다. 동결 전 몇 달의 두 선이 나란한지 먼저 그려 본다.

체험실의 실제 예: 2024-11-12부터 1~9세대 건물만 쓰레기를 뚜껑 있는 통에 내놓게 됐다. 10세대 이상 건물을 대조군으로 두면, 1~9세대 ÷ 10세대 이상의 쥐 목격 신고 비율이 정책 뒤 약 19% 줄었다. 정책이 없던 해끼리 같은 계산을 하면 +7%, −9%가 나온다. 이 '가짜 정책' 흔들림이 효과 크기를 읽을 때의 오차 폭이다.
"""

[ecological_fallacy]
title = "생태학적 오류"
kind = "통계"
summary = "동네(집단) 단위의 관계를 개인의 행동이나 동기로 읽는 잘못."
body = """
"세입자가 많은 동네에 민원이 많다"는 사실은 "세입자가 민원을 많이 낸다"를 보장하지 않는다.
그 동네의 집주인이 많이 냈을 수도 있다. 집단 단위 상관은 **묶는 단위를 키울수록 커지는** 경향도 있다.
개인에 대해 말하려면 개인 단위 자료(설문 등)가 필요하다.
"""

[confounding]
title = "교란 변수(공통 원인)"
kind = "통계"
summary = "두 변수가 함께 움직이는 것이 서로의 영향이 아니라 제3의 원인 때문일 수 있다."
body = """
맘다니 득표율과 민원율이 함께 높아도, 둘 다 **임차율**이 만든 결과일 수 있다.
확인하는 방법: 임차율이 비슷한 동네끼리 묶은 **안에서도** 관계가 남는지 보거나(층화),
회귀에 임차율을 함께 넣는다(통제). 남는 관계가 작으면 처음 상관은 공통 원인 때문이다.
"""

[acs_bins]
title = "ACS 범주의 한계"
kind = "데이터"
summary = "ACS는 값을 칸으로 묶어 준다. 가장 끝 칸(예: '1939년 이전')은 그 안의 차이를 볼 수 없다."
body = """
건축연도는 '2020년 이후', '2010–2019' … '1940–1949', '1939년 이전'처럼 칸으로 나온다.
1890년 건물과 1935년 건물이 같은 칸이다. 그래서 "아주 오래된 집"끼리의 차이는 보이지 않는다.
더 자세한 연도는 PLUTO(필지별 건축연도)를 붙여야 얻을 수 있다.
"""

[rent_stabilization]
title = "임대료 안정화(rent stabilization)"
kind = "뉴욕"
summary = "뉴욕시 임대 아파트 약 100만 호의 연간 인상률을 임대료가이드라인위원회(RGB)가 정하는 제도."
body = """
주로 1974년 이전에 지은 6세대 이상 건물의 아파트가 대상이다. 세입자는 갱신 계약을 받을 권리가 있고,
인상률은 해마다 RGB 표결로 정한다(1년·2년 계약 따로). RGB 위원 9명은 시장이 임명한다.
안정화 여부는 아파트 단위로 주 정부 기관(HCR)에 등록되고, RGB는 안정화 아파트가 있는 **건물 목록**을 공개한다.
"""

[boundary_overlay]
title = "경계 겹치기(공간 결합)"
kind = "데이터"
summary = "Tract, 선거구, 우편번호처럼 경계가 다른 지역 단위를 서로 옮길 때는 겹친 비율로 나눠 붙인다."
body = """
선거구(의회·시의회·투표구)와 Census Tract는 경계가 맞지 않는다. 한 Tract가 두 선거구에 걸치기도 한다.
값을 옮기는 방법은 세 가지다. ① **중심점**: Tract 중심점이 들어간 선거구에 통째로 넣는다(간단, 거칠다)
② **면적 비율**: 겹친 면적만큼 나눈다 ③ **인구 비율**: 더 작은 단위(블록)의 인구로 나눈다(가장 정확).
어느 방법을 썼는지와, 경계에 걸친 Tract가 몇 개인지를 함께 적는다.
"""

[small_numbers]
title = "작은 수의 출렁임"
kind = "통계"
summary = "하루 몇 건짜리 자료는 우연만으로도 두세 배씩 오르내린다. 사건 하나의 효과를 읽기 어렵다."
body = """
하루 평균 1건인 민원이 어느 날 3건이 되면 '세 배'지만, 이런 일은 우연으로도 흔하다(포아송 변동).
작은 지역·짧은 기간·드문 유형일수록 이 출렁임이 크다. 그래서 사례 하나를 볼 때는
① 기간을 넓혀 평소 출렁임의 폭을 먼저 보고 ② 같은 기간 비슷한 다른 지역과 비교하고
③ 결론을 '인과'가 아니라 '사례 기록'으로 쓴다.
"""

[accountability]
title = "책임 소재"
kind = "뉴욕"
summary = "311 민원은 시 기관이 처리한다. 숫자를 그 일에 권한이 없는 사람의 성적표로 쓰면 안 된다."
body = """
쓰레기 수거는 위생국(DSNY), 난방 단속은 주택보존개발국(HPD), 소음·주차는 경찰(NYPD)이 맡고, 모두 시장 산하다.
**시의원**은 시 예산과 조례, 기관 감독을 맡고, **연방 하원의원**은 연방 법과 예산을 다룬다.
지역구 민원이 많다는 것은 그 지역의 사정을 보여 줄 뿐, 그 지역 국회의원의 업무 성과가 아니다.
"""

[contacting_propensity]
title = "신고 성향(contacting propensity)"
kind = "311"
summary = "같은 문제를 겪어도 정부에 연락하는 정도는 사람과 동네마다 다르다(Minkoff 2016)."
body = """
신고 성향은 시간, 정보, 언어, 정부에 대한 신뢰, '말하면 바뀐다'는 기대에 따라 달라진다.
311 건수는 이 성향과 실제 문제의 양이 섞인 값이다. 투표·공청회 참여처럼 다른 '시민 참여' 지표와
함께 움직이는지 보면 성향의 몫을 가늠할 수 있다. 신고 경로(전화·웹·앱)의 차이도 성향의 한 단서다.
"""

[choropleth]
title = "면적이 거짓말하는 지도"
kind = "데이터"
summary = "단계구분도(choropleth)는 넓은 지역을 크게 보여 준다. 사람 수와 눈에 띄는 정도가 어긋난다."
body = """
Tract마다 색을 칠한 지도에서는 넓은 Tract가 시선을 차지한다. 그런데 넓은 Tract는 대개 사람이 적다.
뉴욕에서 가장 넓은 Tract 10%가 지도 면적의 절반 가까이를 차지하지만 인구는 10% 남짓이다.
대안: **카토그램**(인구에 비례해 지역 크기를 바꾼다), **점 밀도 지도**(사람 수만큼 점), **육각 격자**,
또는 지도 옆에 막대그래프를 함께 둔다. 두 지도가 '닮았다'고 하려면 Tract 단위 상관을 따로 계산한다.
"""

[majority_group]
title = "과반 집단으로 동네 나누기"
kind = "데이터"
summary = "Tract 인구의 50% 이상을 차지하는 인종·민족 집단으로 동네를 나눈다. 아무도 50%가 안 되면 '과반 없음'."
body = """
ACS의 히스패닉(인종 무관), 비히스패닉 백인·흑인·아시아계 비율을 쓴다. 가장 큰 집단이 50% 이상이면 그 집단의 '다수 Tract'다.
이 구분은 **동네의 구성**을 말할 뿐 그 안의 개인을 말하지 않는다. 히스패닉 다수 Tract에도 다른 집단이 절반 가까이 살 수 있다.
경계를 50%에서 60%로 바꾸면 '과반 없음'이 늘어난다. 기준을 바꿔도 결론이 같은지 확인하는 것이 좋다.
"""

[stratification]
title = "맞춰 놓고 비교하기(층화)"
kind = "통계"
summary = "다른 변수(예: 소득)가 같은 집단끼리 묶은 안에서 비교하면, 그 변수의 영향을 걷어 낼 수 있다."
body = """
히스패닉 비율과 난방 민원이 함께 높아도 소득이 둘 다를 움직였을 수 있다. 소득 5분위마다 **따로** 히스패닉 비율과 민원의 관계를 보면,
'소득이 같은데도 남는 차이'만 남는다. 칸을 잘게 나눌수록 칸마다 Tract 수가 줄어 숫자가 불안정해진다. 칸마다 Tract 수를 함께 적는다.
"""

[simpson]
title = "심슨의 역설"
kind = "통계"
summary = "전체에서 본 관계가 하위 집단 안에서는 약해지거나 뒤집힌다."
body = """
뉴욕 전체에서는 '부유할수록 민원이 적다'(ρ −0.13)지만 브루클린 안에서는 '부유할수록 많다'(+0.17)다.
전체 상관은 자치구 사이의 차이(어느 자치구가 부유하고 민원이 많은가)와 자치구 안의 관계가 섞인 값이다.
하위 집단마다 관계를 따로 보고, 방향이 다른 집단이 있으면 그 이유를 찾는다.
"""

[underreporting]
title = "과소신고의 뜻"
kind = "311"
summary = "과소신고는 '신고가 적다'가 아니라 '실제 문제에 비해' 적다는 뜻이다. 분모가 실제 문제다."
body = """
어떤 동네의 신고가 다른 동네의 2배여도, 실제 위반이 4배라면 그 동네는 **과소신고**다.
그래서 과소신고를 판정하려면 신고와 독립된 '실제 문제' 자료가 필요하다. 주거는 HPD 점검·위반, 쥐는 보건국 점검,
홍수는 센서·피해 기록이다. 311 안에서는 '점검했을 때 문제가 나온 비율'이 대리 지표가 될 수 있다.
"""

[proxy]
title = "대리 지표"
kind = "통계"
summary = "직접 잴 수 없는 것을 대신 보여 주는 지표. 무엇을 대신하는지와 어디서 어긋나는지를 함께 적는다."
body = """
예: 'NY-14 선거구' 대신 '히스패닉 비율 상위 동네', '실제 쥐 문제' 대신 '점검에서 위반이 나온 비율'.
대리 지표는 빠르지만 원래 대상과 어긋나는 부분이 있다. 페이지에 **대리 지표라고 명시**하고,
진짜 자료를 붙일 방법(→ [결합])을 함께 적는다.
"""

[digital_divide]
title = "디지털 격차"
kind = "311"
summary = "앱·웹을 쓰기 어려운 사람은 전화로 신고하거나 아예 신고하지 않는다."
body = """
311은 전화(여러 언어 통역), 웹, 앱으로 신고를 받는다. 앱과 웹은 사진·위치를 붙이기 쉽지만 인터넷과 영어(또는 지원 언어)가 필요하다.
동네마다 신고 경로가 다르면, 경로에 따라 처리 방식이나 기록 품질이 달라질 때 그 차이가 동네 차이로 보인다.
ACS의 인터넷 가입(B28002)과 영어 능력(C16002) 표를 붙이면 경로 차이의 원인을 가늠할 수 있다.
"""

[change_two_points]
title = "변화는 두 시점이 필요하다"
kind = "데이터"
summary = "'젠트리피케이션 중', '늘었다'처럼 변화를 말하려면 같은 정의로 잰 두 시점의 자료가 있어야 한다."
body = """
ACS 5개년 추정치는 겹치지 않는 두 기간(예: 2015–2019, 2020–2024)을 비교하는 것이 원칙이다.
Tract 경계는 10년마다 바뀌므로(2010 → 2020) 경계 대응표(relationship file)로 맞춘다.
젠트리피케이션 정의는 연구마다 다르다(소득·학력·임대료 상승, 처음 소득 수준 조건 등). 어떤 정의를 썼는지 적는다.
"""

[redlining]
title = "레드라이닝(HOLC 등급)"
kind = "뉴욕"
summary = "1930년대 연방 주택소유자대출공사(HOLC)가 동네마다 A–D 등급을 매겨, D(빨강) 지역의 대출을 사실상 막았다."
body = """
등급은 인종 구성을 크게 반영했다. D 등급 동네는 투자가 끊기고 건물 노후화가 빨라졌다는 연구가 많다.
Mapping Inequality 프로젝트(리치먼드 대학)가 등급 지도를 디지털화해 GeoJSON으로 공개한다.
옛 경계와 오늘의 Tract는 맞지 않아서 **경계 겹치기**(면적 비율)로 등급을 Tract에 옮긴다.
"""

[regression_to_mean]
title = "평균으로의 회귀"
kind = "통계"
summary = "극단값으로 뽑힌 집단은 다시 재면 덜 극단적으로 나온다. 아무 일이 없어도 생긴다."
body = """
어떤 값이든 '진짜 수준'과 '그때의 우연'이 섞여 있다. 상위 10%로 뽑힌 동네는 진짜 수준도 높지만 그때 운도 나빴던 곳이 많다.
다음에 재면 운은 평균으로 돌아오므로 숫자가 내려온다. 하위 10%는 반대로 올라온다.
"민원 상위 동네에 집중 단속 → 이듬해 감소 → 효과 있음"이라는 주장은 이 효과를 빼야 한다.
**대조군**(단속하지 않은 비슷한 상위 동네)과 비교하는 것이 기본이다.
"""

[report_time]
title = "접수 시각 ≠ 발생 시각"
kind = "311"
summary = "311의 시각은 신고가 들어온 때다. 문제가 생긴 때와 다를 수 있다."
body = """
밤 소음은 대개 소음이 나는 동안 신고하므로 접수와 발생이 가깝다. 반면 가로등·도로 파손은 발견하고 한참 뒤에 신고하기도 하고,
아침 출근길에 몰아서 신고하기도 한다. 시각 패턴을 볼 때는 유형마다 '언제 신고하는가'를 함께 생각한다.
자정 무렵 경계에 걸친 신고는 날짜가 바뀌어 다음 날로 잡힌다.
"""

[baseline]
title = "비교 기준 정하기"
kind = "통계"
summary = "'많다·적다·평범하다'는 무엇과 비교했는지에 따라 달라진다. 기준을 함께 적는다."
body = """
새해 첫날 소음 2,092건은 1년 평균(2,158건)과 비교하면 평범하지만, 같은 1월 평일(약 1,300건)과 비교하면 1.6배다.
기준 후보: 1년 평균, 같은 달 평균, 같은 요일 평균, 작년 같은 날. 계절성이 강한 자료일수록 **같은 계절** 기준이 맞다.
"""

[moving_average]
title = "이동평균"
kind = "통계"
summary = "며칠씩 묶어 평균을 내면 하루하루의 출렁임이 줄고 큰 흐름이 보인다."
body = """
7일 이동평균은 그날을 가운데 두고 앞뒤 3일씩, 7일의 평균이다. 요일 효과(주말에 많고 적음)도 함께 지워진다.
대신 하루짜리 급등(한파 첫날)은 납작해진다. 흐름은 이동평균으로, 사건은 원래 값으로 본다.
"""

[weather_join]
title = "날씨 자료 붙이기"
kind = "데이터"
summary = "NOAA는 관측소별 일별 최고·최저기온, 강수량을 공개한다. 날짜로 바로 311에 붙일 수 있다."
body = """
뉴욕은 센트럴파크 관측소(GHCN-Daily USW00094728)가 기준으로 많이 쓰인다. NOAA의 Climate Data Online에서 받는다.
날짜 하나로 합치므로 가장 쉬운 결합이다. 다만 도시 안에서도 기온이 다르다(열섬). 동네별로 보려면
라과디아·JFK 관측소를 함께 쓰거나 위성 지표면 온도를 쓴다. 단위(°F/°C)와 '하루'의 기준 시각을 확인한다.
"""

[sensitivity]
title = "민감도 분석"
kind = "통계"
summary = "의심스러운 값을 빼거나 기준을 바꿔도 결론이 유지되는지 확인한다."
body = """
결론이 이상치 하나, 기준 하나에 기대고 있다면 약한 결론이다. 이상치를 뺀 값, 기준을 바꾼 값을 **나란히** 보여 주고
"그래도 1위다"처럼 무엇이 유지되고 무엇이 바뀌었는지 적는다. 순위는 유지돼도 격차가 크게 줄었다면 그것도 결과의 일부다.
"""

[record_vs_person]
title = "민원 1건 ≠ 시민 1명"
kind = "311"
summary = "한 사람이 여러 번 신고할 수 있고, 한 번의 신고가 여러 건으로 기록될 수도 있다."
body = """
공개 311 자료에는 신고자 정보가 없다. 그래서 '몇 명이 불편을 느꼈나'를 직접 셀 수 없다.
반대 방향의 함정도 있다. 주택 민원은 한 번의 전화가 문제 부위(벽, 천장, 라디에이터)마다 따로 기록되기도 한다.
반복 신고를 추정하려면 같은 주소·유형·짧은 시간 간격을 묶되, 이런 기록 방식 차이를 함께 확인한다.
"""

[expected_observed]
title = "기대값과 관측값"
kind = "통계"
summary = "'아무 쏠림이 없다면 얼마여야 하나'(기대)를 먼저 정하고, 실제(관측)와 비교한다."
body = """
하루 24시간 중 8시간이면 기대 비율은 33%다. 실제로 45%가 그 8시간에 들어왔다면 그만큼 쏠린 것이다.
여러 칸을 한꺼번에 비교할 때는 **카이제곱 검정**을 쓴다. 칸마다 (관측 − 기대)² ÷ 기대를 더한 값이 클수록 '고르다'는 가정에서 멀다.
표본이 수십만 건이면 아주 작은 차이도 통계적으로 유의하게 나오므로, 차이의 **크기**를 함께 본다.
"""

[sensor_vs_report]
title = "센서와 신고"
kind = "데이터"
summary = "센서는 '자리'에서 실제 소리를 재고, 신고는 '사람'이 불편을 알린다. 둘을 겹치면 과소·과잉 신고가 보인다."
body = """
NYU의 SONYC 프로젝트는 뉴욕 곳곳에 소음 센서를 달아 소리의 크기와 종류를 기록했다.
센서 값이 높은데 신고가 적은 곳은 '참고 사는 동네', 센서는 낮은데 신고가 많은 곳은 '민감한 동네'일 수 있다.
비교는 같은 격자(예: 100m 칸)와 같은 시간대로 맞춘다. 센서는 몇십 곳뿐이라 도시 전체를 덮지 못한다.
"""

[gini]
title = "지니 계수와 로렌츠 곡선"
kind = "통계"
summary = "분포가 얼마나 쏠렸는지를 0(완전히 고름)–1(한 곳이 전부)로 나타낸다."
body = """
값을 큰 순서(또는 작은 순서)로 줄 세워 누적 비율을 그린 것이 로렌츠 곡선(집중 곡선)이다.
완전히 고르면 대각선이고, 쏠릴수록 곡선이 대각선에서 멀어진다. 대각선과 곡선 사이 넓이를 0–1로 바꾼 값이 지니 계수다.
소득 불평등에 흔히 쓰지만 민원·주소·건물의 쏠림에도 그대로 쓸 수 있다.
"""

[small_denominator]
title = "분모가 작으면 비율이 폭주한다"
kind = "통계"
summary = "인구 12명인 곳에 민원 679건이면 1,000명당 56,583건이 된다. 작은 분모는 비율을 무의미하게 만든다."
body = """
비율은 분모가 작을수록 불안정하다. 공원, 공항, 상업지처럼 사는 사람은 거의 없고 오가는 사람이 많은 곳은 1인당 수치가 폭주한다.
대처: ① 분모가 일정 크기 미만인 단위를 빼거나(여기서는 인구 1,000명 미만 Tract)
② 작은 단위를 이웃과 묶거나 ③ 분모를 바꾼다(유동 인구, 면적). 무엇을 했는지 반드시 적는다.
"""

[lift]
title = "향상도(lift): 함께 나오는 정도"
kind = "통계"
summary = "두 일이 함께 일어나는 빈도가 '우연히 함께 일어날 빈도'의 몇 배인지. 1이면 무관, 클수록 함께 다닌다."
body = """
향상도 = P(A와 B) ÷ (P(A) × P(B)). 장바구니 분석(연관 규칙)에서 쓰는 지표다.
건물 민원에 쓰면 "바닥·계단 민원이 있는 건물에 가전 민원도 함께 나오는가"를 볼 수 있다.
주의: 문제가 많은 큰 건물은 거의 모든 유형이 함께 나와서, 많은 짝의 향상도가 비슷하게 높아진다. 건물 크기(세대 수)를 함께 봐야 한다.
"""

[place_address]
title = "주소가 '장소'일 때"
kind = "데이터"
summary = "311 주소는 집 주소만이 아니다. 공항, 공원, 큰길 이름, 교차로도 주소 칸에 들어간다."
body = """
'JOHN F KENNEDY AIRPORT', 'BROADWAY', 'HIGHLAND PARK'처럼 장소나 도로 이름이 주소로 들어온다.
이런 주소는 '그곳에 사는 사람'이 아니라 '그곳을 지나간 사람'의 민원이다.
주소별·건물별 분석을 할 때는 BBL이 있는지, 주소에 번지가 있는지로 장소형 주소를 먼저 가려낸다.
"""

[long_tail]
title = "긴 꼬리"
kind = "통계"
summary = "소수의 항목이 대부분을 차지하고, 나머지 많은 항목은 아주 적게 나오는 분포."
body = """
311 유형 197가지 중 상위 10개가 민원의 57%를 차지하고, 45가지는 1년에 100건도 안 된다.
꼬리의 유형은 건수는 적어도 도시의 다양한 일을 보여 준다. 반대로 분석할 때는 꼬리 유형을 '기타'로 묶어야
표가 읽힌다. 무엇을 묶었는지 적어 둔다. 세로축을 로그로 그리면 머리와 꼬리를 한 그림에 담을 수 있다.
"""

[category_absent]
title = "칸이 없으면 숫자도 없다"
kind = "311"
summary = "311은 미리 정해진 유형 칸으로 신고를 받는다. 칸이 없는 문제는 다른 칸에 섞이거나 아예 잡히지 않는다."
body = """
전기자전거가 보도를 막는 문제는 들어갈 칸이 마땅치 않다. 공유 킥보드 칸(E-Scooter)은 있지만 개인 전기자전거는 아니다.
그래서 '전기자전거 민원 419건'은 실제 체감보다 훨씬 적게 보인다.
새로운 도시 문제를 311로 재려면 ① 비슷한 칸(불법주차, 보도 막음)을 함께 보고 ② 세부 설명을 읽고 ③ 칸이 생긴 시점을 확인한다.
"""

[broken_windows]
title = "깨진 유리창 이론"
kind = "뉴욕"
summary = "작은 무질서를 방치하면 큰 범죄로 이어진다는 주장. 1990년대 뉴욕 경찰 정책의 바탕이 됐다."
body = """
1982년 윌슨과 켈링이 제시했고, 1990년대 줄리아니 시장과 브래턴 경찰청장이 지하철 무임승차, 낙서, 차창 닦이(스퀴지) 단속에 적용했다.
범죄 감소에 얼마나 기여했는지는 지금도 논쟁 중이고, 과잉 단속과 인종 차별 비판도 크다.
311의 '사회적 무질서' 민원(→ 10번)과 스퀴지 민원(→ 78번)은 이 논쟁의 오늘을 보여 주는 작은 창이다.
"""

[spurious]
title = "우연한 상관(가짜 상관)"
kind = "통계"
summary = "아무 관계없는 두 값도 같은 흐름(계절, 시간 추세)을 타면 강하게 함께 움직인다."
body = """
월별 자료처럼 점이 적고 계절·추세가 강하면 상관계수가 쉽게 ±0.8을 넘는다. 아이스크림 트럭 소음과 난방 민원은 −0.86이지만 서로 아무 상관이 없다.
확인 방법: ① 공통 흐름(계절)을 빼고 남은 변동끼리 상관을 본다 ② 같은 관계가 다른 해·다른 도시에서도 나오는지 본다
③ 둘을 잇는 그럴듯한 경로가 있는지 묻는다. Tyler Vigen의 Spurious Correlations 사이트에 이런 예가 수백 개 있다.
"""

[truncation]
title = "잘린 자료(부분 기간)"
kind = "데이터"
summary = "자료의 처음과 끝은 하루·한 달이 다 들어 있지 않은 경우가 많다. 그 칸을 다른 칸과 비교하면 안 된다."
body = """
추출 시각이 저녁 9시면 첫날은 9시 이후만, 마지막 날은 9시까지만 들어온다. 월 단위로 묶으면 첫 달·마지막 달이 그렇다.
가장 적은 날, 가장 적은 달을 고를 때 이 칸이 1위로 나오면 의심한다.
자료의 정확한 시작·끝 시각을 먼저 확인하고, 잘린 칸은 빼거나 하루 평균으로 바꾼다.
"""

[multiple_testing]
title = "다중 비교와 FDR"
kind = "통계"
summary = "검정을 많이 하면 우연히 '유의'한 결과가 쏟아진다. 여러 번 검정했다면 그만큼 기준을 엄격하게 해야 한다."
body = """
유의수준 5%로 2,195번 검정하면, 아무 효과가 없어도 약 110개가 '유의'하게 나온다.
FDR(거짓 발견률) 보정은 '유의하다고 고른 것 중 틀린 것의 비율'을 일정 수준(예: 5%) 아래로 맞추도록 p값 기준을 조정한다(Benjamini–Hochberg).
보정 뒤에 남는 결과만 '이 동네가 특별하다'고 말할 근거가 있다.
"""

[map_classes]
title = "지도 색 구간 나누기"
kind = "데이터"
summary = "같은 자료도 구간을 5분위로 나누느냐, 같은 간격으로 나누느냐에 따라 지도가 완전히 달라진다."
body = """
- **5분위(분위수)**: 칸마다 같은 수의 지역. 늘 '가장 진한 20%'가 생긴다. 차이가 작아도 대비가 커 보인다.
- **같은 간격**: 값 범위를 똑같이 나눈다. 치우친 분포에서는 대부분이 연한 칸에, 극소수만 진한 칸에 들어간다.
- **자연 구간(Jenks)**, **표준편차 구간** 등도 있다.
어떤 방식을 썼는지 범례에 적고, 가능하면 두 방식을 함께 보여 준다. Mark Monmonier의 『How to Lie with Maps』가 고전적 교재다.
"""

[admin_echo]
title = "행정 순환(administrative echo)"
kind = "311"
summary = "두 행정 자료가 같은 출발점(신고)에서 나왔다면 서로를 '확인'해 주는 독립 증거가 아니다."
body = """
쥐 점검의 상당수가 311 신고에서 출발한다. 그러면 '신고가 많은 곳 = 점검이 많은 곳 = 쥐 발견이 많은 곳'이 된다.
두 자료의 상관이 높아도 그것은 같은 신고의 메아리다. 신고와 독립된 기준(정기 점검, 무작위 표본 점검, 센서)이 있어야 '신고가 맞았다'고 말할 수 있다.
"""

[institutional_change]
title = "제도 변화를 현상 변화로 착각하기"
kind = "311"
summary = "숫자의 급변은 현실이 아니라 기관의 일하는 방식(순찰 도입, 기관 편입, 유형 이름 변경) 때문일 수 있다."
body = """
2016년 노숙인 신고 급증은 SCOUT 순찰 도입과 언론 보도 때문이었다는 분석이 있다(DCJ). 2021년 공공주택(NYCHA) 민원의 311 편입도 비슷한 착시를 만든다.
급변을 보면 먼저 묻는다: 그 무렵 유형 목록, 담당 기관, 접수 경로, 홍보가 바뀌지 않았나? 바뀌었다면 바뀐 전후를 같은 기준으로 맞춘다.
"""
