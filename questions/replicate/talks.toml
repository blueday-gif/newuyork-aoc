# 발표후보 쪽(app_pages/talks.py)이 읽는 해설. 수치 표와 그림은 out/<키>/ 의 CSV·PNG에서 읽는다.
# 후보를 더할 때는 [키] 표를 하나 추가하고 out/<키>/ 에 같은 이름의 파일을 둔다.

[ramphal]
label = "소음 불평등과 계절성"
paper = "Ramphal 등(2022), Environmental Research"
related = [67, 40, 52]
headline = """
**저소득 동네일수록 7월에 소음 민원이 겨울보다 더 많이 늘어난다(Q1 1.68배, Q4 1.29배).**
차이는 거의 다 **거리 소음**에서 나온다. 다만 이 격차는 브롱크스라는 지역 차이와 거의 겹치고,
한 주소의 반복 신고가 들어가면 방향까지 뒤집힌다.
"""
data = "NYC 311 소음 민원 720,093건(2025-11 ~ 2026-10), ACS 2024 5개년, Census Tract 2,177개를 소득 4분위로 나눴다."

compare = """
| 항목 | Ramphal 등(2022) | 이번 재현(2025-11 ~ 2026-10) |
|---|---|---|
| 자료 | 2010년 이후 311 소음 민원 400만 건 이상 | 소음 민원 72만 건, 1년 |
| 비교 방식 | **해마다** 7월 증가율(전년 7월 대비) | **같은 해 안에서** 7월 ÷ 겨울(12~2월) 월평균 |
| 저소득 분위 | 2019→2020 **+103%**, 평년 +29% | Q1 **1.68배**(1.47~1.92) |
| 고소득 분위 | 2019→2020 **+50%**, 평년 +11% | Q4 **1.29배**(1.15~1.46) |
| 저소득 ÷ 고소득 | 2020년 1.35, 평년 1.16 | **1.30**(1.09~1.55) |
| 결론의 방향 | 여름 증가가 저소득 지역에 집중 | **같은 방향.** 자치구별 계절을 통제하면 약해진다 |
| 재현 불가 | 팬데믹 전후 변화 | 1년 자료라 연도 비교를 할 수 없다 |
"""
compare_note = "두 수치는 측정 방식이 달라 크기를 직접 비교할 수 없다. 같은 것은 방향뿐이다. 원 논문 수치는 이 앱의 논문 요약에서 가져왔다."

chart1 = "거리 소음만 여름에 산처럼 솟고, 그 산이 저소득 동네에서 가장 높다. 주거 소음은 1년 내내 저소득 동네가 높지만 여름에 오히려 조금 낮아진다. 유형마다 세로축 범위가 다르다."
chart2 = "로그 눈금이라 2배와 0.5배가 기준선(1배)에서 같은 거리에 있다. Q1 거리 소음의 구간이 넓은 것은 겨울 신고의 1/4이 한 주소(108-26 159th St)에 몰려 있기 때문이다."

observed = """
- 소음 민원은 저소득 동네(Q1)에서 1년 내내 많다. 인구 10만 명당 연간 Q1 11,486건, Q4 6,692건(1.72배).
- 7월 ÷ 겨울 월평균은 Q1 1.68배, Q4 1.29배다. 격차 1.30배(95% 구간 1.09~1.55).
- 차이는 **거리 소음**에서 나온다(Q1 6.84배, Q4 3.05배). **주거 소음**은 Q1만 여름에 줄어든다(0.86배).
- 같은 날·같은 주소 반복 신고가 저소득 동네에서 많다(Q1 40.7%, Q4 20.6%).
"""
can_say = """
- "여름에 소음 신고가 늘어나는 정도는 저소득 동네에서 더 크다"는 원 논문의 **방향**은 2025~2026년에도 나타난다.
  자치구 고정효과를 넣은 포아송 회귀에서도 격차는 1.30배다(1.08~1.55, p = 0.005).
- 다만 **"저소득이라서"와 "브롱크스라서"를 가르기 어렵다.** Q1 Tract 545개 중 222개가 브롱크스이고,
  브롱크스의 7월 ÷ 겨울은 2.05로 다섯 자치구 중 가장 높다. 자치구마다 계절 효과를 따로 허용하면
  격차는 1.07(0.88~1.32, p = 0.49)로 구분되지 않는다.
- 그래서 "여름 소음 신고의 불균형은 **소득과 지역이 겹친 곳**에 집중된다"까지가 말할 수 있는 범위다.
"""
limits = """
- **311은 소음이 아니라 신고를 잰다.** 더 시끄러워서인지, 창문을 열어 더 잘 들려서인지, 신고를 더 해서인지 가를 수 없다.
- **한 해 자료다.** 원 논문의 핵심인 팬데믹 전후 변화는 재현할 수 없다.
- **소수 주소가 결과를 흔든다.** 655 E 230th St 한 주소를 넣으면 격차가 0.83으로 **뒤집힌다.**
- **생태학적 오류.** Tract 평균 소득으로 나눴으므로 "저소득 가구가 더 신고한다"고 말할 수 없다.
- 에어컨 보급, 야외 활동, 휴가로 집을 비우는 정도 같은 설명은 **가설**이다. 이 자료로 검증하지 않았다.
"""

cleaning = """
- **ACS 센티널 값(-666666666 등):** CSV를 만들 때 이미 결측으로 바뀌어 있었다(남은 셀 0개).
- **Tract 제외:** 인구 0명 84개, 1,000명 미만 48개(분모 폭주 방지, 이 앱의 공통 기준), 중위 소득 결측 18개 → 2,177개.
- **중복 신고:** 같은 날짜·같은 주소·같은 유형. 주소가 비면 중복으로 세지 않았다. 중복을 빼도 격차는 1.36으로 남는다.
- **이상치 주소:** 655 E 230th St(4.7만 건, 11~12월 집중)는 본 분석에서 뺐다. 넣은 결과는 민감도 표에 있다.
"""
method = """
1. 311 소음 민원(유형 이름이 'Noise'로 시작하는 8개 유형)을 좌표로 Census Tract에 붙였다.
2. Tract를 ACS 중위 가구 소득으로 4분위(Tract 수 기준)로 나눴다.
3. 분위·월·유형(주거, 거리, 상업, 기타)별로 인구 10만 명당 민원을 냈다.
4. 7월 ÷ 겨울(12~2월) 월평균을 계산하고, Tract를 다시 뽑는 부트스트랩(2,000회)으로 95% 구간을 냈다.
5. Tract × 월(겨울 3개월 + 7월) 건수로 포아송 회귀(인구 오프셋, Tract 군집 표준오차)를 돌렸다.

코드: `questions/replicate/ramphal_noise.py` (311 원본이 필요해 로컬에서만 돈다. 이 쪽은 그 결과 파일만 읽는다.)
"""

[[ramphal.qa]]
q = "저소득 동네가 실제로 더 시끄러운 건가요, 아니면 신고를 더 하는 건가요?"
a = "이 자료로는 가를 수 없다. 311은 신고 건수라서 실제 소음, 신고 습관, 또는 둘 다일 수 있다. 같은 날 같은 주소의 반복 신고가 저소득 동네에서 두 배(41% 대 21%)라 신고 행동 차이가 섞인 것은 분명하다. 반대로 반복 신고를 모두 빼도 여름 격차는 1.36으로 남는다. 실제 소음은 센서 측정 자료가 있어야 알 수 있다."

[[ramphal.qa]]
q = "브롱크스를 통제하면 차이가 사라진다면서, 그럼 소득은 상관없다는 뜻인가요?"
a = "아니다. '가를 수 없다'는 뜻이다. 저소득 Tract의 41%가 브롱크스라서 소득과 지역이 거의 같은 정보를 담는다. 자치구마다 계절 효과를 따로 주면 소득 차이를 추정할 자료가 줄어 구간이 넓어지고(0.88~1.32) 1을 포함한다. 다음 단계는 브롱크스 안에서 소득이 다른 동네끼리 비교하는 것이다."

[[ramphal.qa]]
q = "원 논문은 103%인데 이번엔 1.68배입니다. 재현에 실패한 것 아닌가요?"
a = "같은 질문을 다른 자로 잰 것이다. 103%는 '2020년 7월이 2019년 7월보다 얼마나 늘었나', 1.68배는 '올해 7월이 올해 겨울의 몇 배인가'다. 1년 자료로는 연도 비교를 할 수 없어 크기가 아니라 방향을 재현했고, 방향은 같다. 같은 원본에서 2019~2025년 7월을 더 뽑으면 논문 방식 그대로 비교할 수 있다."
